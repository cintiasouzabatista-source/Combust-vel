<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuelTrack Lead</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root {--primary: #2563eb; --bg: #f1f5f9; --card: #fff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0;}
body.dark {--bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --border: #334155;}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui; background: var(--bg); color: var(--text); padding-bottom: 80px; }
.container { max-width: 600px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
h1 { font-size: 20px; margin-bottom: 12px; }
h3 { font-size: 16px; margin-bottom: 8px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
input, select, button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; }
.btn { background: var(--primary); color: #fff; border: none; font-weight: 600; cursor: pointer; }
.btn-outline { background: transparent; border: 1px solid var(--border); cursor: pointer; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; }
.btn-nav { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; }
.btn-nav.active { color: var(--primary); }
.theme-toggle { position: absolute; top: 16px; right: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.odometro-destaque { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 14px 16px; }
.odometro-destaque h1 { font-size: 28px; font-weight: 700; }
.dias-semana { display: flex; gap: 6px; flex-wrap: wrap; }
.dia-btn { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); cursor: pointer; flex:1; }
.dia-btn.active { background: var(--primary); color: #fff; }
.historico-item { border-bottom:1px solid var(--border); padding:8px 0; display:flex; justify-content:space-between; align-items:center; }
.historico-acoes { display:flex; gap:8px; }
.historico-acoes button { background:none; border:none; cursor:pointer; padding:6px; width:auto; color: var(--primary); }
.select-veiculo { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; font-weight:600; margin-bottom:8px; }
.select-veiculo option { color: #0f172a; }
</style>
</head>
<body>
<div class="container">
    <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
    <h1>FuelTrack Lead</h1>

    <div id="painel" class="tab-content active">
        <div class="card odometro-destaque">
            <select id="selectVeiculoPainel" class="select-veiculo" onchange="trocarVeiculo(this.value)"></select>
            <div style="display:flex; justify-content:space-between; align-items:center">
                <div><p>Odômetro Virtual</p><h1 id="odometroVirtual">0 km</h1></div>
                <button class="btn-outline" style="background:rgba(255,255,255,0.2); color:white; width:auto; padding:8px; border-radius:50%" onclick="ajustarOdometro()"><i class="fas fa-sliders-h"></i></button>
            </div>
        </div>
        <div class="grid-2"><div class="card"><p>Média Real</p><h3 id="mediaReal">-- km/l</h3></div><div class="card"><p>Gasto Total</p><h3 id="gastoTotal">R$ 0,00</h3></div></div>
        <div class="card" style="height:220px"><h3>Consumo km/l</h3><canvas id="graficoConsumo"></canvas></div>
    </div>

    <div id="abastecer" class="tab-content">
        <div class="card"><h3 id="tituloAbast">Novo Abastecimento</h3>
            <input id="aData" type="date"><input id="aKm" type="number" placeholder="Km">
            <div class="grid-2"><input id="aLitros" type="number" step="0.01" placeholder="Litros" oninput="calcTotal()"><input id="aValorL" type="number" step="0.01" placeholder="R$ / L" oninput="calcTotal()"></div>
            <input id="aTotal" type="number" step="0.01" placeholder="Total R$" readonly>
            <button class="btn" id="btnSalvarAbast" onclick="addAbast()">Salvar</button>
            <button class="btn-outline" id="btnCancelarAbast" onclick="cancelarEditAbast()" style="display:none; margin-top: 10px;">Cancelar</button>
        </div>
        <div class="card"><h3>Histórico</h3><div id="listaAbast"></div></div>
    </div>

    <div id="manutencao" class="tab-content">
        <div class="card"><h3 id="tituloManut">Adicionar Manutenção</h3>
            <input id="mData" type="date"><input id="mKm" type="number" placeholder="Km"><input id="mTipo" type="text" placeholder="Ex: Troca Óleo">
            <button class="btn" id="btnSalvarManut" onclick="addManut()">Salvar</button>
            <button class="btn-outline" id="btnCancelarManut" onclick="cancelarEditManut()" style="display:none; margin-top: 10px;">Cancelar</button>
        </div>
        <div class="card"><h3>Histórico</h3><div id="listaManut"></div></div>
    </div>

    <div id="veiculo" class="tab-content">
        <div class="card"><h3>Meus Veículos</h3><div id="listaVeiculos"></div><button class="btn" onclick="novoVeiculo()" style="margin-top:12px"><i class="fas fa-plus"></i> Cadastrar</button></div>
    </div>

    <div id="config" class="tab-content">
        <div class="card"><h3>Config</h3>
            <label>Km Inicial</label><input id="kmBase" type="number" onchange="salvarConfig()" style="margin-bottom: 15px;">
            <label>Dias que roda</label>
            <div class="dias-semana" id="diasSemana" style="margin-top: 10px;">
                <button type="button" class="dia-btn" data-dia="0">Dom</button><button type="button" class="dia-btn" data-dia="1">Seg</button>
                <button type="button" class="dia-btn" data-dia="2">Ter</button><button type="button" class="dia-btn" data-dia="3">Qua</button>
                <button type="button" class="dia-btn" data-dia="4">Qui</button><button type="button" class="dia-btn" data-dia="5">Sex</button>
                <button type="button" class="dia-btn" data-dia="6">Sáb</button>
            </div>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <button class="btn-nav active" onclick="showTab('painel')"><i class="fas fa-gauge-high"></i><span>Painel</span></button>
    <button class="btn-nav" onclick="showTab('abastecer')"><i class="fas fa-gas-pump"></i><span>Abastecer</span></button>
    <button class="btn-nav" onclick="showTab('manutencao')"><i class="fas fa-wrench"></i><span>Manutenção</span></button>
    <button class="btn-nav" onclick="showTab('veiculo')"><i class="fas fa-motorcycle"></i><span>Veículo</span></button>
    <button class="btn-nav" onclick="showTab('config')"><i class="fas fa-gear"></i><span>Config</span></button>
</nav>

<script>
let grafico;
let veiculos = JSON.parse(localStorage.getItem('veiculos') || '[]');
let veiculoAtivoId = localStorage.getItem('veiculoAtivoId') || null;
let editandoAbastId = null;
let editandoManutId = null;

function getVeiculoAtivo() {
    if(!veiculoAtivoId && veiculos.length) veiculoAtivoId = veiculos[0].id;
    return veiculos.find(v => v.id === veiculoAtivoId) || criarVeiculoDefault();
}

function criarVeiculoDefault() {
    const hoje = new Date().toISOString().slice(0,10);
    const v = { id: 'v1', nome: 'Moto Lead', abast: [], manut: [], config: {kmBase:0, dataBase:hoje, kmValor:600, diasSemana:[0,1,2,3,4,5,6]} };
    veiculos = [v];
    veiculoAtivoId = v.id;
    salvarTudo();
    return v;
}

function salvarTudo() { localStorage.setItem('veiculos', JSON.stringify(veiculos)); localStorage.setItem('veiculoAtivoId', veiculoAtivoId); }

function showTab(id) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.currentTarget.classList.add('active');
    if(id === 'painel') { renderSelectVeiculo(); atualizarPainel(); }
    if(id === 'abastecer') renderAbast();
    if(id === 'manutencao') renderManut();
    if(id === 'config') carregarConfig();
    if(id === 'veiculo') renderVeiculos();
}

function renderSelectVeiculo() {
    const sel = document.getElementById('selectVeiculoPainel');
    sel.innerHTML = veiculos.map(v => `<option value="${v.id}" ${v.id===veiculoAtivoId?'selected':''}>${v.nome}</option>`).join('');
}

function toggleTheme() { document.body.classList.toggle('dark'); }

function kmPorDia(v) { return (parseInt(v.config.kmValor) || 0) / 30; }

function calcularOdometroVirtual(v) {
    const c = v.config; const kmBase = parseInt(c.kmBase) || 0; const dataBase = new Date(c.dataBase); const kmDia = kmPorDia(v); const diasSemana = c.diasSemana || [];
    let kmTotal = kmBase; let dataCalc = new Date(dataBase); const agora = new Date();
    while (dataCalc < agora) { dataCalc.setDate(dataCalc.getDate() + 1); if (diasSemana.includes(dataCalc.getDay())) kmTotal += kmDia; }
    return Math.floor(kmTotal);
}

function atualizarPainel() {
    const v = getVeiculoAtivo();
    const kmVirtual = calcularOdometroVirtual(v);
    document.getElementById('odometroVirtual').textContent = kmVirtual.toLocaleString('pt-BR') + ' km';
    let totalKm = 0, totalL = 0, gasto = 0;
    if(v.abast.length >= 2) {
        for(let i = 1; i < v.abast.length; i++) { totalKm += v.abast[i].km - v.abast[i-1].km; totalL += v.abast[i].litros; }
        gasto = v.abast.reduce((acc, a) => acc + parseFloat(a.total), 0);
        const media = totalL > 0 ? (totalKm / totalL) : 0;
        document.getElementById('mediaReal').textContent = media > 0 ? media.toFixed(1) + ' km/l' : '-- km/l';
    }
    document.getElementById('gastoTotal').textContent = 'R$ ' + gasto.toFixed(2).replace('.', ',');
    renderGrafico(v);
}

function ajustarOdometro() { const v = getVeiculoAtivo(); const kmAtual = prompt('Km atual do painel da moto?'); if (kmAtual) { v.config.kmBase = parseInt(kmAtual); v.config.dataBase = new Date().toISOString().slice(0,10); salvarTudo(); atualizarPainel(); } }

function calcTotal() { const l = parseFloat(document.getElementById('aLitros').value) || 0; const vL = parseFloat(document.getElementById('aValorL').value) || 0; document.getElementById('aTotal').value = (l * vL).toFixed(2); }

function addAbast() {
    const v = getVeiculoAtivo();
    const data = document.getElementById('aData').value; const km = parseInt(document.getElementById('aKm').value);
    const litros = parseFloat(document.getElementById('aLitros').value); const valorL = parseFloat(document.getElementById('aValorL').value); const total = parseFloat(document.getElementById('aTotal').value);
    if (!data || !km || !litros || !valorL) return alert('Preencha os campos');
    if(editandoAbastId) { const idx = v.abast.findIndex(a=>a.id===editandoAbastId); v.abast[idx] = {id:editandoAbastId, data, km, litros, valorL, total}; }
    else v.abast.push({ id: Date.now(), data, km, litros, valorL, total });
    v.abast.sort((a,b) => new Date(a.data) - new Date(b.data)); salvarTudo(); renderAbast(); cancelarEditAbast(); atualizarPainel();
}

function renderAbast() { const v = getVeiculoAtivo(); const div = document.getElementById('listaAbast'); div.innerHTML = v.abast.slice().reverse().map(a => `<div class="historico-item"><div><b>${a.km} km</b> - ${a.litros}L R$${a.total.toFixed(2)}</div><div class="historico-acoes"><button onclick="editarAbast(${a.id})"><i class="fas fa-pen"></i></button><button style="color:#ef4444" onclick="delAbast(${a.id})"><i class="fas fa-trash"></i></button></div></div>`).join(''); }
function editarAbast(id) { const a = getVeiculoAtivo().abast.find(x=>x.id===id); editandoAbastId=id; document.getElementById('aData').value=a.data; document.getElementById('aKm').value=a.km; document.getElementById('aLitros').value=a.litros; document.getElementById('aValorL').value=a.valorL; document.getElementById('aTotal').value=a.total; document.getElementById('btnSalvarAbast').textContent='Atualizar'; document.getElementById('btnCancelarAbast').style.display='block'; }
function cancelarEditAbast() { editandoAbastId=null; document.getElementById('btnSalvarAbast').textContent='Salvar'; document.getElementById('btnCancelarAbast').style.display='none'; }
function delAbast(id) { getVeiculoAtivo().abast = getVeiculoAtivo().abast.filter(a => a.id!== id); salvarTudo(); renderAbast(); atualizarPainel(); }

function addManut() { const v = getVeiculoAtivo(); const data = document.getElementById('mData').value; const km = parseInt(document.getElementById('mKm').value); const tipo = document.getElementById('mTipo').value; if (!data || !km || !tipo) return alert('Preencha tudo'); if(editandoManutId) { const idx = v.manut.findIndex(m=>m.id===editandoManutId); v.manut[idx] = {id:editandoManutId, data, km, tipo}; } else v.manut.push({ id: Date.now(), data, km, tipo }); salvarTudo(); renderManut(); cancelarEditManut(); }
function renderManut() { const v = getVeiculoAtivo(); const div = document.getElementById('listaManut'); div.innerHTML = v.manut.slice().reverse().map(m => `<div class="historico-item"><div><b>${m.tipo}</b> - ${m.km} km</div><div class="historico-acoes"><button onclick="editarManut(${m.id})"><i class="fas fa-pen"></i></button><button style="color:#ef4444" onclick="delManut(${m.id})"><i class="fas fa-trash"></i></button></div></div>`).join(''); }
function editarManut(id) { const m = getVeiculoAtivo().manut.find(x=>x.id===id); editandoManutId=id; document.getElementById('mData').value=m.data; document.getElementById('mKm').value=m.km; document.getElementById('mTipo').value=m.tipo; document.getElementById('btnSalvarManut').textContent='Atualizar'; document.getElementById('btnCancelarManut').style.display='block'; }
function cancelarEditManut() { editandoManutId=null; document.getElementById('btnSalvarManut').textContent='Salvar'; document.getElementById('btnCancelarManut').style.display='none'; }
function delManut(id) { getVeiculoAtivo().manut = getVeiculoAtivo().manut.filter(m => m.id!== id); salvarTudo(); renderManut(); }

function renderGrafico(v) {
    const ctx = document.getElementById('graficoConsumo').getContext('2d');
    if(grafico) grafico.destroy();
    const labels = [], data = [];
    for(let i = 1; i < v.abast.length; i++) { labels.push(v.abast[i].data); data.push(((v.abast[i].km - v.abast[i-1].km)/v.abast[i].litros).toFixed(1)); }
    grafico = new Chart(ctx, { type: 'bar', data: { labels, datasets: [{ label: 'Km/L', data, backgroundColor: '#2563eb' }] }, options: { responsive: true, maintainAspectRatio: false } });
}

function renderVeiculos() { document.getElementById('listaVeiculos').innerHTML = veiculos.map(v => `<div class="historico-item"><div><b>${v.nome}</b></div><div class="historico-acoes"><button onclick="trocarVeiculo('${v.id}')"><i class="fas fa-check"></i></button><button style="color:#ef4444" onclick="excluirVeiculo('${v.id}')"><i class="fas fa-trash"></i></button></div></div>`).join(''); }
function novoVeiculo() { const nome = prompt('Nome do veículo?'); if(nome) { veiculos.push({id:'v'+Date.now(), nome, abast:[], manut:[], config:{kmBase:0, dataBase:new Date().toISOString().slice(0,10), kmValor:30, diasSemana:[1,2,3,4,5]}}); salvarTudo(); renderVeiculos(); } }
function trocarVeiculo(id) { veiculoAtivoId = id; salvarTudo(); renderSelectVeiculo(); atualizarPainel(); showTab('painel'); }
function excluirVeiculo(id) { if(veiculos.length > 1) { veiculos = veiculos.filter(v => v.id!== id); if(veiculoAtivoId === id) veiculoAtivoId = veiculos[0].id; salvarTudo(); renderVeiculos(); renderSelectVeiculo(); atualizarPainel(); } }

function carregarConfig() { const v = getVeiculoAtivo(); document.getElementById('kmBase').value = v.config.kmBase; document.querySelectorAll('.dia-btn').forEach(b => b.classList.toggle('active', v.config.diasSemana.includes(parseInt(b.dataset.dia)))); }
function salvarConfig() { const v = getVeiculoAtivo(); v.config.kmBase = parseInt(document.getElementById('kmBase').value) || 0; v.config.diasSemana = [...document.querySelectorAll('.dia-btn.active')].map(b => parseInt(b.dataset.dia)); salvarTudo(); atualizarPainel(); }
document.querySelectorAll('.dia-btn').forEach(b => { b.onclick = () => { b.classList.toggle('active'); salvarConfig(); }; });

document.addEventListener('DOMContentLoaded', () => {
    if(!veiculos.length) criarVeiculoDefault();
    renderSelectVeiculo();
    atualizarPainel();
});
</script>
</body>
</html>
