<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Meus Veículos</title>
    <meta name="theme-color" content="#2563eb">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

<header>
    <h1><i class="fas fa-car"></i> Garagem</h1>
    <button onclick="toggleTheme()"><i id="theme-icon" class="fas fa-moon"></i></button>
</header>

<nav class="tabs">
    <button class="active" onclick="trocarAba('painel')"><i class="fas fa-chart-line"></i> Painel</button>
    <button onclick="trocarAba('abastecer')"><i class="fas fa-gas-pump"></i> Abastecer</button>
    <button onclick="trocarAba('manutencao')"><i class="fas fa-wrench"></i> Manutenção</button>
    <select id="selectVeiculo" onchange="mudarVeiculo()"></select>

<button onclick="trocarAba('veiculos')"><i class="fas fa-car"></i> Veículos</button>

<section id="veiculos" class="aba">
    <div class="card">
        <h3>Gerenciar Veículos</h3>
        <input id="vNome" type="text" placeholder="Apelido do Veículo (ex: Palio)">
        <button class="btn" onclick="salvarVeiculo()">Salvar Veículo</button>
    </div>
    <div id="listaVeiculos"></div>
    <div class="card" style="margin-top: 20px;">
        <button class="btn" style="background:#ef4444" onclick="resetarApp()">Resetar Todo o App</button>
    </div>
</section>
</nav>

<main>
    <section id="painel" class="aba active">
        <div class="kpi-grid">
            <div class="card"><p>Média Geral</p><h2 id="mediaGeral">0 km/L</h2></div>
            <div class="card"><p>Total Gasto</p><h2 id="totalGasto">R$ 0,00</h2></div>
            <div class="card"><p>Km Atual</p><h2 id="kmAtual">0 km</h2></div>
            <div class="card" id="cardOleo"><p>Próx. Troca Óleo</p><h2 id="proxOleo">-</h2></div>
        </div>
        <div class="card">
            <h3>Últimos Abastecimentos</h3>
            <div id="ultimosAbast"></div>
        </div>
        <div class="card"><button class="btn" onclick="exportarCSV()"><i class="fas fa-download"></i> Exportar CSV</button></div>
    </section>

    <section id="abastecer" class="aba">
        <div class="card">
            <h3>Novo Abastecimento</h3>
            <input id="aData" type="date">
            <input id="aKm" type="number" placeholder="Km odômetro">
            <div class="grid-3">
                <input id="aLitros" type="number" step="0.01" placeholder="Litros">
                <input id="aValorL" type="number" step="0.001" placeholder="R$/L">
                <input id="aTotal" type="number" step="0.01" placeholder="Total R$">
            </div>
            <select id="aTipo">
                <option value="Gasolina">Gasolina</option>
                <option value="Etanol">Etanol</option>
                <option value="Diesel">Diesel</option>
            </select>
            <button class="btn" onclick="addAbast()"><i class="fas fa-plus"></i> Salvar</button>
        </div>
        <div id="listaAbast"></div>
    </section>

   <section id="manutencao" class="aba">
</main>
<script src="script.js"></script>
</body>
</html>
