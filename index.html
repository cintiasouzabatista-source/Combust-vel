<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Moto Control</title>
  <style>
    /* Estilos mantidos da sua versão original */
    :root{--bg:#0b0f19;--panel:#131a26;--card:#1c2533;--text:#eaf1ff;--muted:rgba(234,241,255,.65);--accent:#2b6dff;--danger:#ff476f;--ok:#29d17c;--warning:#ffb84d;--line:rgba(255,255,255,.08);--radius:18px;}
    body{margin:0;color:var(--text);font-family:sans-serif;background:var(--bg);padding-bottom:100px;}
    .main{padding:16px;}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;}
    .label{color:var(--muted);font-size:11px;}
    .val{font-size:18px;font-weight:700;margin-top:6px;}
    .section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
    .footer-clean{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:20px;padding:12px 22px;background:rgba(19,26,38,.95);border:1px solid var(--line);border-radius:30px;z-index:999;backdrop-filter:blur(10px);}
    .footer-clean button{border:none;background:none;color:var(--muted);font-size:20px;cursor:pointer;}
    .footer-clean button.active{color:var(--text);transform:translateY(-2px);}
    input,select{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);margin-top:5px;}
    .btn{width:100%;padding:12px;border-radius:14px;background:var(--accent);color:white;border:none;font-weight:600;margin-top:10px;}
  </style>
</head>
<body>

<main class="main">
  <div class="topbar">
    <h1>Moto Control</h1>
    <button id="themeBtn" style="background:none;border:none;color:var(--text)">🌓</button>
  </div>

  <select id="globalVehicle" style="margin-bottom: 20px;"></select>

  <section class="section" id="view-painel">
    <div class="cards">
      <div class="card"><div class="label">Média (Km/L)</div><div class="val" id="kmlGeral">--</div></div>
      <div class="card"><div class="label">Prox. Abast. (Est.)</div><div class="val" id="proxAbast">--</div></div>
      <div class="card"><div class="label">Total Gasto</div><div class="val" id="totalGasto">R$ 0</div></div>
      <div class="card"><div class="label">Km Atual</div><div class="val" id="kmAtual">0</div></div>
    </div>
  </section>

  <section class="section view" id="view-abastecer" style="display:none">...</section>
</main>

<nav class="footer-clean">
  <button data-view="painel" class="active">🏠</button>
  <button data-view="abastecer">⛽</button>
  <button data-view="historico">🧾</button>
  <button data-view="manutencao">🔧</button>
  <button data-view="veiculos">🚘</button>
</nav>

<script>
// --- SUA LÓGICA DE DADOS CONTINUA AQUI ---
// (Certifique-se de copiar seu código JavaScript original para baixo deste ponto)

// Função para o novo Card de Próximo Abastecimento
function atualizarProxAbastecimento() {
    let filtered = items.filter(x => x.veiculo === activeVehicle);
    if(filtered.length >= 2) {
        // Calcula média de km por dia dos últimos registros
        const d1 = new Date(filtered[filtered.length-2].data);
        const d2 = new Date(filtered[filtered.length-1].data);
        const dias = Math.max(1, (d2 - d1) / (1000 * 60 * 60 * 24));
        const kmRodados = filtered[filtered.length-1].odometro - filtered[filtered.length-2].odometro;
        const kmDia = kmRodados / dias;
        
        // Estima dias para próximo abastecimento (assumindo tanque de 6L para moto)
        const autonomia = 150; 
        const diasRestantes = Math.round(autonomia / kmDia);
        document.getElementById("proxAbast").textContent = diasRestantes + " dias";
    }
}

// Chame essa função dentro da sua função renderAll() original
</script>
</body>
</html>
