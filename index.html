<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Veiculos</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root {
    --primary: #2563eb; --bg: #f1f5f9; --card: #fff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --danger: #ef4444; --warn: #f59e0b; --success: #10b981;
}
body.dark { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --border: #334155; }
/* Temas Dinâmicos */
body.tema-moto { --primary: #e67e22; }
body.tema-carro { --primary: #2980b9; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; overflow-x: hidden; }
.container { max-width: 600px; margin: 0 auto; padding: 16px; }
.header-area { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
.header-select { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 600; font-size: 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.btn { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; }
.btn-toggle-form { background: transparent; border: 1px dashed var(--primary); color: var(--primary); padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 12px; cursor: pointer; }
.tabs-view-wrapper { width: 100%; overflow: hidden; }
.tabs-container-fluid { display: flex; width: 500%; transition: transform 0.25s; }
.tab-content { width: 20%; flex-shrink: 0; padding: 0 4px; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 10; }
.btn-nav { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.btn-nav.active { color: var(--primary); }
.odometro-destaque { background: var(--primary); color: white; padding: 16px; border-radius: 16px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
    <div class="header-area">
        <h1>Veículos</h1>
        <select id="seletorVeiculoPrincipal" class="header-select" onchange="mudarVeiculoAtivo()"></select>
        <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
    </div>

    <div class="tabs-view-wrapper" id="swipeArea">
        <div class="tabs-container-fluid" id="tabsFluid">
            <div id="painel" class="tab-content">
                <div class="card odometro-destaque">
                    <p>Odômetro Virtual</p>
                    <h1 id="odometroVirtual">0 km</h1>
                </div>
                <div class="card"><p>Média Real: <span id="mediaReal">0 km/l</span></p></div>
            </div>
            <div id="abastecer" class="tab-content">
                <button class="btn-toggle-form" id="btnToggleAbast" onclick="toggleFormulario('formAbast', this)">➕ Registrar Abastecimento</button>
                <div class="card" id="formAbast" style="display:none;">
                    <input id="aKm" type="number" placeholder="Km (Opcional - usa o virtual se vazio)" style="width:100%; padding:10px; margin-bottom:8px;">
                    <input id="aData" type="date" style="width:100%; padding:10px; margin-bottom:8px;">
                    <input id="aLitros" type="number" step="0.01" placeholder="Litros" style="width:100%; padding:10px; margin-bottom:8px;">
                    <button class="btn" onclick="addAbast()">Salvar</button>
                </div>
            </div>
            <div id="manutencao" class="tab-content"><h3>Manutenção</h3></div>
            <div id="veiculo" class="tab-content"><h3>Veículos</h3></div>
            <div id="config" class="tab-content"><h3>Configurações</h3></div>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <button class="btn-nav active" onclick="navegarParaIndice(0)"><i class="fas fa-gauge-high"></i><span>Painel</span></button>
    <button class="btn-nav" onclick="navegarParaIndice(1)"><i class="fas fa-gas-pump"></i><span>Abastecer</span></button>
    <button class="btn-nav" onclick="navegarParaIndice(2)"><i class="fas fa-wrench"></i><span>Manutenção</span></button>
    <button class="btn-nav" onclick="navegarParaIndice(3)"><i class="fas fa-car"></i><span>Veículo</span></button>
    <button class="btn-nav" onclick="navegarParaIndice(4)"><i class="fas fa-gear"></i><span>Config</span></button>
</nav>

<script>
let veiculos = JSON.parse(localStorage.getItem('veiculos') || '[{"id":"moto1","tipo":"moto","marca":"Honda","modelo":"Lead","km":90000},{"id":"carro1","tipo":"carro","marca":"Ford","modelo":"Fiesta","km":80000}]');
let veiculoAtivoId = localStorage.getItem('veiculoAtivoId') || "moto1";
let abastecimentos = JSON.parse(localStorage.getItem('abast') || '[]');

function aplicarTemaVeiculo() {
    const vAtivo = veiculos.find(v => v.id === veiculoAtivoId);
    document.body.classList.remove('tema-carro', 'tema-moto');
    if (vAtivo) document.body.classList.add('tema-' + vAtivo.tipo);
}

function calcularOdometroVirtual() {
    // Lógica básica de exemplo: retorna o KM base do veículo
    const v = veiculos.find(x => x.id === veiculoAtivoId);
    return v ? v.km : 0;
}

function addAbast() {
    let kmInput = document.getElementById('aKm').value;
    const km = kmInput ? parseInt(kmInput) : calcularOdometroVirtual();
    const litros = document.getElementById('aLitros').value;
    
    abastecimentos.push({ veiculoId: veiculoAtivoId, km, litros, data: new Date().toISOString() });
    localStorage.setItem('abast', JSON.stringify(abastecimentos));
    alert("Salvo com sucesso!");
    atualizarPainel();
}

function mudarVeiculoAtivo() {
    veiculoAtivoId = document.getElementById('seletorVeiculoPrincipal').value;
    localStorage.setItem('veiculoAtivoId', veiculoAtivoId);
    aplicarTemaVeiculo();
    atualizarPainel();
}

function atualizarPainel() {
    document.getElementById('odometroVirtual').innerText = calcularOdometroVirtual() + " km";
}

function toggleFormulario(id, btn) {
    const f = document.getElementById(id);
    f.style.display = f.style.display === "block" ? "none" : "block";
}

function navegarParaIndice(i) {
    document.getElementById('tabsFluid').style.transform = `translateX(-${i * 20}%)`;
}

// Inicialização
document.getElementById('seletorVeiculoPrincipal').innerHTML = veiculos.map(v => `<option value="${v.id}" ${v.id==veiculoAtivoId?'selected':''}>${v.modelo}</option>`).join('');
aplicarTemaVeiculo();
atualizarPainel();
</script>
</body>
</html>
