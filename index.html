<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuelTrack Lead</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
    :root { --primary: #2563eb; --bg: #f1f5f9; --card: #fff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --danger: #ef4444; --warn: #f59e0b; }
    body.dark { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --border: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    input, select, button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; margin-bottom: 8px; }
    .btn { background: var(--primary); color: #fff; border: none; font-weight: 600; cursor: pointer; }
    .btn-danger { background: var(--danger); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; }
    .btn-nav { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .btn-nav.active { color: var(--primary); }
    .odometro-destaque { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; padding: 16px; border-radius: 16px; margin-bottom: 12px; }
    .alerta-bar { padding: 10px; border-radius: 12px; margin-bottom: 12px; font-size: 14px; display: none; }
    .alerta-bar.warn { display: block; background: rgba(245,158,11,0.2); color: var(--warn); border: 1px solid var(--warn); }
    .alerta-bar.danger { display: block; background: rgba(239,68,68,0.2); color: var(--danger); border: 1px solid var(--danger); }
</style>
</head>
<body>
<div class="container">
    <div id="alertaBar" class="alerta-bar"></div>
    <div id="painel" class="tab-content active">
        <div class="card odometro-destaque">
            <p>Odômetro Virtual</p>
            <h1 id="odometroVirtual">0 km</h1>
            <button class="btn" style="background:rgba(255,255,255,0.2); color:white; margin-top:10px" onclick="ajustarOdometro()">Ajustar KM</button>
        </div>
        <div class="grid-2" style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="card"><p>Média</p><h3 id="mediaReal">0 km/l</h3></div>
            <div class="card"><p>Gasto</p><h3 id="gastoTotal">R$ 0,00</h3></div>
        </div>
        <div class="card"><h3>Consumo</h3><canvas id="graficoConsumo"></canvas></div>
    </div>
    
    <div id="abastecer" class="tab-content">
        <div class="card"><h3>Novo Abastecimento</h3>
            <input id="aData" type="date">
            <input id="aKm" type="number" placeholder="KM Odômetro">
            <input id="aLitros" type="number" step="0.01" placeholder="Litros" oninput="calcTotal()">
            <input id="aValorL" type="number" step="0.01" placeholder="R$ por Litro" oninput="calcTotal()">
            <input id="aTotal" type="number" readonly placeholder="Total R$">
            <button class="btn" onclick="addAbast()">Salvar Abastecimento</button>
        </div>
        <div class="card"><h3>Histórico</h3><div id="listaAbast"></div></div>
    </div>

    <div id="manutencao" class="tab-content">
        <div class="card"><h3>Manutenção</h3>
            <input id="mData" type="date"><input id="mKm" type="number" placeholder="KM"><input id="mTipo" type="text" placeholder="Tipo (ex: Óleo)">
            <button class="btn" onclick="addManut()">Salvar Manutenção</button>
        </div>
        <div class="card"><div id="listaManut"></div></div>
    </div>

    <div id="config" class="tab-content">
        <div class="card"><h3>Configurações</h3>
            <input id="kmBase" type="number" placeholder="KM Inicial">
            <button class="btn btn-danger" onclick="limparTudo()">Apagar Tudo</button>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <button class="btn-nav active" onclick="showTab('painel', this)"><i class="fas fa-gauge"></i>Painel</button>
    <button class="btn-nav" onclick="showTab('abastecer', this)"><i class="fas fa-gas-pump"></i>Abastecer</button>
    <button class="btn-nav" onclick="showTab('manutencao', this)"><i class="fas fa-wrench"></i>Manut</button>
    <button class="btn-nav" onclick="showTab('config', this)"><i class="fas fa-gear"></i>Config</button>
</nav>

<script>
    let abast = JSON.parse(localStorage.getItem('abast') || '[]');
    let manut = JSON.parse(localStorage.getItem('manut') || '[]');
    let config = JSON.parse(localStorage.getItem('config') || '{"kmBase":0}');

    function showTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    function calcTotal() {
        const l = parseFloat(document.getElementById('aLitros').value) || 0;
        const v = parseFloat(document.getElementById('aValorL').value) || 0;
        document.getElementById('aTotal').value = (l * v).toFixed(2);
    }

    function addAbast() {
        const novo = {
            id: Date.now(),
            data: document.getElementById('aData').value,
            km: parseInt(document.getElementById('aKm').value),
            litros: parseFloat(document.getElementById('aLitros').value),
            total: parseFloat(document.getElementById('aTotal').value)
        };
        abast.push(novo);
        localStorage.setItem('abast', JSON.stringify(abast));
        renderTudo();
    }

    function addManut() {
        const novo = { id: Date.now(), data: document.getElementById('mData').value, km: document.getElementById('mKm').value, tipo: document.getElementById('mTipo').value };
        manut.push(novo);
        localStorage.setItem('manut', JSON.stringify(manut));
        renderTudo();
    }

    function ajustarOdometro() {
        const novoKm = prompt("KM atual real:");
        if(novoKm) { config.kmBase = parseInt(novoKm); localStorage.setItem('config', JSON.stringify(config)); renderTudo(); }
    }

    function renderTudo() {
        document.getElementById('odometroVirtual').innerText = config.kmBase + " km";
        // Renderizar listas e gráficos aqui...
    }

    function limparTudo() { if(confirm("Apagar tudo?")) { localStorage.clear(); location.reload(); } }

    document.addEventListener('DOMContentLoaded', renderTudo);
</script>
</body>
</html>
