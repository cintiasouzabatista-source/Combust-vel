<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Moto Control</title>
  <style>
    :root{ --bg:#0b0f19; --panel:#131a26; --card:#1c2533; --text:#eaf1ff; --muted:rgba(234,241,255,.65); --accent:#2b6dff; --ok:#29d17c; --line:rgba(255,255,255,.08); }
    body{ margin:0; font-family:sans-serif; background:var(--bg); color:var(--text); }
    .main{ padding:16px 14px 100px; }
    .card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; }
    .cards{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .val{ font-size:18px; font-weight:700; margin-top:5px; }
    .label{ color:var(--muted); font-size:11px; }
    .section{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:16px; }
    .footer-clean{ position:fixed; bottom:20px; left:5%; width:90%; display:flex; justify-content:space-around; background:rgba(25,30,40,.9); padding:15px; border-radius:30px; backdrop-filter:blur(10px); }
    button{ cursor:pointer; }
  </style>
</head>
<body>
<main class="main">
  <div class="cards">
    <div class="card">
      <div class="label">Média</div>
      <div class="val" id="kmlGeral">--</div>
    </div>
    <div class="card">
      <div class="label">Próximo Abast.</div>
      <div class="val" id="proxAbast">--</div>
    </div>
  </div>

  <section class="section" id="view-painel">
    <h3>Painel</h3>
    <div id="status">Selecione uma opção abaixo</div>
  </section>
</main>

<nav class="footer-clean">
  <button onclick="alert('Painel')">🏠</button>
  <button onclick="alert('Abastecer')">⛽</button>
  <button onclick="alert('Histórico')">🧾</button>
  <button onclick="alert('Config')">⚙️</button>
</nav>

<script>
// Lógica de cálculo do próximo abastecimento
function calcularProxAbastecimento(historico) {
  if (historico.length < 2) return "Insuficiente";
  
  // Pega o intervalo médio de km entre os últimos abastecimentos
  const ultimos = historico.slice(-3);
  let somatorioKm = 0;
  for(let i = 1; i < ultimos.length; i++) {
    somatorioKm += (ultimos[i].odometro - ultimos[i-1].odometro);
  }
  
  const mediaKm = somatorioKm / (ultimos.length - 1);
  const autonomiaMedia = 150; // Ajuste conforme a autonomia da sua moto
  
  // Exemplo simples: estimativa baseada na média
  return Math.round(autonomiaMedia / (mediaKm/30)) + " dias";
}

// Inicialização básica
window.onload = () => {
  // Simulação de dados para teste
  const mockHistorico = [
    { odometro: 93000, data: '2026-06-01' },
    { odometro: 93300, data: '2026-06-10' }
  ];
  
  document.getElementById('proxAbast').textContent = calcularProxAbastecimento(mockHistorico);
  document.getElementById('kmlGeral').textContent = "35 km/L";
}
</script>
</body>
</html>
