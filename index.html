<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle Veículo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { Plus, Fuel, Wrench, Bike, X, ChevronUp, ChevronDown, BarChart3, List } = LucideReact;

    function App() {
      const [vehicles, setVehicles] = useState([
        { id: 1, name: 'Honda Lead', kmCompra: 93667, kmDia: 35, tanque: 6.5, dataCompra: '2024-01-01' }
      ]);
      const [refuels, setRefuels] = useState([
        { id: 1, vehicleId: 1, date: '2024-06-17', km: 93867, liters: 3.9, price: 6.2 }
      ]);
      const [maintenances, setMaintenances] = useState([
        { id: 1, vehicleId: 1, date: '2024-06-01', km: 93700, type: 'Troca de óleo', cost: 120 }
      ]);

      const [activeTab, setActiveTab] = useState('panel');
      const [isMobile, setIsMobile] = useState(false);

      const [modalState, setModalState] = useState({
        vehicle: { open: false, minimized: false, data: {} },
        refuel: { open: false, minimized: false, data: {} },
        maintenance: { open: false, minimized: false, data: {} }
      });

      const timersRef = useRef({});

      useEffect(() => {
        const checkMobile = () => setIsMobile(window.innerWidth < 768);
        checkMobile();
        window.addEventListener('resize', checkMobile);
        return () => window.removeEventListener('resize', checkMobile);
      }, []);

      useEffect(() => {
        Object.keys(modalState).forEach(key => {
          const modal = modalState[key];
          if (isMobile && modal.minimized && modal.open) {
            if (timersRef.current[key]) clearTimeout(timersRef.current[key]);
            timersRef.current[key] = setTimeout(() => {
              closeModal(key);
            }, 30000);
          } else {
            if (timersRef.current[key]) {
              clearTimeout(timersRef.current[key]);
              timersRef.current[key] = null;
            }
          }
        });

        return () => {
          Object.values(timersRef.current).forEach(t => t && clearTimeout(t));
        };
      }, [modalState, isMobile]);

      const openModal = (type) => {
        setModalState(prev => ({
         ...prev,
          [type]: {...prev[type], open: true, minimized: false, data: {} }
        }));
      };

      const minimizeModal = (type) => {
        setModalState(prev => ({
         ...prev,
          [type]: {...prev[type], minimized: true }
        }));
      };

      const maximizeModal = (type) => {
        setModalState(prev => ({
         ...prev,
          [type]: {...prev[type], minimized: false }
        }));
      };

      const closeModal = (type) => {
        setModalState(prev => ({
         ...prev,
          [type]: { open: false, minimized: false, data: {} }
        }));
      };

      const handleModalChange = (type, field, value) => {
        setModalState(prev => ({
         ...prev,
          [type]: {...prev[type], data: {...prev[type].data, [field]: value } }
        }));
      };

      const saveVehicle = () => {
        const data = modalState.vehicle.data;
        if (!data.name ||!data.kmCompra) return alert('Preencha nome e km');
        const newVehicle = {
          id: Date.now(),
          name: data.name,
          kmCompra: Number(data.kmCompra),
          kmDia: Number(data.kmDia) || 30,
          tanque: Number(data.tanque) || 6,
          dataCompra: data.dataCompra || new Date().toISOString().split('T')[0]
        };
        setVehicles([...vehicles, newVehicle]);
        closeModal('vehicle');
      };

      const saveRefuel = () => {
        const data = modalState.refuel.data;
        if (!data.km ||!data.liters) return alert('Preencha km e litros');
        const newRefuel = {
          id: Date.now(),
          vehicleId: vehicles[0].id,
          date: data.date || new Date().toISOString().split('T')[0],
          km: Number(data.km),
          liters: Number(data.liters),
          price: Number(data.price) || 6
        };
        setRefuels([...refuels, newRefuel]);
        closeModal('refuel');
      };

      const saveMaintenance = () => {
        const data = modalState.maintenance.data;
        if (!data.type ||!data.km) return alert('Preencha tipo e km');
        const newMaint = {
          id: Date.now(),
          vehicleId: vehicles[0].id,
          date: data.date || new Date().toISOString().split('T')[0],
          km: Number(data.km),
          type: data.type,
          cost: Number(data.cost) || 0
        };
        setMaintenances([...maintenances, newMaint]);
        closeModal('maintenance');
      };

      const getKmAtual = () => {
        const vehicle = vehicles[0];
        const lastRefuel = refuels.filter(r => r.vehicleId === vehicle.id).sort((a,b) => new Date(b.date) - new Date(a.date))[0];
        if (!lastRefuel) return vehicle.kmCompra;
        const hoje = new Date().toISOString().split('T')[0];
        if (lastRefuel.date === hoje) return lastRefuel.km;
        const diasUteis = Math.max(1, Math.floor((new Date(hoje) - new Date(lastRefuel.date)) / (1000*60*60*24)));
        return lastRefuel.km + (vehicle.kmDia * diasUteis);
      };

      const kmAtual = getKmAtual();
      const vehicle = vehicles[0];
      const lastRefuel = refuels.filter(r => r.vehicleId === vehicle.id).sort((a,b) => new Date(b.date) - new Date(a.date))[0];
      const consumoMedio = refuels.length > 1? (lastRefuel.km - vehicles[0].kmCompra) / refuels.reduce((acc, r) => acc + r.liters, 0) : 0;

      const Modal = ({ type, title, icon: Icon, color, children }) => {
        const state = modalState[type];
        if (!state.open) return null;

        const colorClasses = {
          blue: 'bg-blue-600',
          green: 'bg-green-600',
          orange: 'bg-orange-600'
        };

        if (state.minimized && isMobile) {
          return (
            <div className={`fixed bottom-0 left-0 right-0 z-50 ${colorClasses[color]} text-white p-3 rounded-t-xl shadow-2xl flex items-center justify-between`}>
              <button onClick={() => maximizeModal(type)} className="flex items-center gap-2 flex-1">
                <Icon size={20} />
                <span className="font-semibold">{title}</span>
                <ChevronUp size={20} />
              </button>
              <button onClick={() => closeModal(type)}>
                <X size={20} />
              </button>
            </div>
          );
        }

        return (
          <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center bg-black/50" onClick={(e) => e.target === e.currentTarget && isMobile && minimizeModal(type)}>
            <div className="bg-white w-full md:w-96 rounded-t-2xl md:rounded-2xl p-4 max-h-[90vh] overflow-y-auto">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-2">
                  <Icon className={`text-${color}-600`} size={24} />
                  <h3 className="text-lg font-bold">{title}</h3>
                </div>
                <div className="flex gap-2">
                  {isMobile && (
                    <button onClick={() => minimizeModal(type)} className="p-2 hover:bg-gray-100 rounded">
                      <ChevronDown size={20} />
                    </button>
                  )}
                  <button onClick={() => closeModal(type)} className="p-2 hover:bg-gray-100 rounded">
                    <X size={20} />
                  </button>
                </div>
              </div>
              {children}
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-gray-100 pb-24">
          <div className="bg-white shadow p-4 sticky top-0 z-10">
            <h1 className="text-2xl font-bold">{vehicle.name}</h1>
            <p className="text-sm text-gray-500">Controle de combustível</p>
          </div>

          <div className="p-4">
            {activeTab === 'panel' && (
              <div className="space-y-4">
                <div className="bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-xl p-6 shadow-lg">
                  <p className="text-sm opacity-90">Km Atual</p>
                  <p className="text-4xl font-bold mt-1">{kmAtual.toLocaleString('pt-BR')} km</p>
                  <p className="text-xs opacity-75 mt-2">Atualiza só se não houver abastecimento hoje</p>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-white rounded-xl p-4 shadow">
                    <p className="text-sm text-gray-600">Consumo Médio</p>
                    <p className="text-2xl font-bold">{consumoMedio.toFixed(1)} km/L</p>
                  </div>
                  <div className="bg-white rounded-xl p-4 shadow">
                    <p className="text-sm text-gray-600">Tanque</p>
                    <p className="text-2xl font-bold">{vehicle.tanque}L</p>
                  </div>
                </div>

                <div className="flex gap-2">
                  <button onClick={() => openModal('refuel')} className="flex-1 bg-green-600 text-white py-3 rounded-lg flex items-center justify-center gap-2 font-semibold">
                    <Fuel size={20} /> Abastecer
                  </button>
                  <button onClick={() => openModal('maintenance')} className="flex-1 bg-orange-600 text-white py-3 rounded-lg flex items-center justify-center gap-2 font-semibold">
                    <Wrench size={20} /> Manutenção
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'history' && (
              <div className="space-y-4">
                <h2 className="text-xl font-bold">Últimos Abastecimentos</h2>
                {refuels.sort((a,b) => new Date(b.date) - new Date(a.date)).map(r => (
                  <div key={r.id} className="bg-white rounded-lg p-4 shadow flex justify-between">
                    <div>
                      <p className="font-semibold">{r.km.toLocaleString('pt-BR')} km</p>
                      <p className="text-sm text-gray-500">{new Date(r.date).toLocaleDateString('pt-BR')}</p>
                    </div>
                    <div className="text-right">
                      <p className="font-semibold">{r.liters}L</p>
                      <p className="text-sm text-gray-500">R$ {r.price}/L</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="fixed bottom-0 left-0 right-0 bg-white border-t flex">
            <button onClick={() => setActiveTab('panel')} className={`flex-1 py-3 flex-col items-center ${activeTab === 'panel'? 'text-blue-600' : 'text-gray-400'}`}>
              <BarChart3 size={24} />
              <span className="text-xs">Painel</span>
            </button>
            <button onClick={() => setActiveTab('history')} className={`flex-1 py-3 flex-col items-center ${activeTab === 'history'? 'text-blue-600' : 'text-gray-400'}`}>
              <List size={24} />
              <span className="text-xs">Histórico</span>
            </button>
            <button onClick={() => openModal('vehicle')} className="flex-1 py-3 flex-col items-center text-gray-400">
              <Bike size={24} />
              <span className="text-xs">Veículo</span>
            </button>
          </div>

          <Modal type="vehicle" title="Novo Veículo" icon={Bike} color="blue">
            <input placeholder="Nome ex: Honda Lead" className="w-full border p-3 rounded-lg mb-3" value={modalState.vehicle.data.name || ''} onChange={e => handleModalChange('vehicle', 'name', e.target.value)} />
            <input type="number" placeholder="Km compra" className="w-full border p-3 rounded-lg mb-3" value={modalState.vehicle.data.kmCompra || ''} onChange={e => handleModalChange('vehicle', 'kmCompra', e.target.value)} />
            <input type="number" placeholder="Km/dia médio" className="w-full border p-3 rounded-lg mb-3" value={modalState.vehicle.data.kmDia || ''} onChange={e => handleModalChange('vehicle', 'kmDia', e.target.value)} />
            <input type="number" step="0.1" placeholder="Tanque em litros" className="w-full border p-3 rounded-lg mb-4" value={modalState.vehicle.data.tanque || ''} onChange={e => handleModalChange('vehicle', 'tanque', e.target.value)} />
            <button onClick={saveVehicle} className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold">Salvar Veículo</button>
          </Modal>

          <Modal type="refuel" title="Abastecimento" icon={Fuel} color="green">
            <input type="date" className="w-full border p-3 rounded-lg mb-3" value={modalState.refuel.data.date || new Date().toISOString().split('T')[0]} onChange={e => handleModalChange('refuel', 'date', e.target.value)} />
            <input type="number" placeholder="Km atual do odômetro" className="w-full border p-3 rounded-lg mb-3" value={modalState.refuel.data.km || ''} onChange={e => handleModalChange('refuel', 'km', e.target.value)} />
            <input type="number" step="0.1" placeholder="Litros abastecidos" className="w-full border p-3 rounded-lg mb-3" value={modalState.refuel.data.liters || ''} onChange={e => handleModalChange('refuel', 'liters', e.target.value)} />
            <input type="number" step="0.01" placeholder="Preço por litro R$" className="w-full border p-3 rounded-lg mb-4" value={modalState.refuel.data.price || ''} onChange={e => handleModalChange('refuel', 'price', e.target.value)} />
            <button onClick={saveRefuel} className="w-full bg-green-600 text-white py-3 rounded-lg font-semibold">Salvar Abastecimento</button>
          </Modal>

          <Modal type="maintenance" title="Nova Manutenção" icon={Wrench} color="orange">
            <input type="date" className="w-full border p-3 rounded-lg mb-3" value={modalState.maintenance.data.date || new Date().toISOString().split('T')[0]} onChange={e => handleModalChange('maintenance', 'date', e.target.value)} />
            <input type="number" placeholder="Km da manutenção" className="w-full border p-3 rounded-lg mb-3" value={modalState.maintenance.data.km || ''} onChange={e => handleModalChange('maintenance', 'km', e.target.value)} />
            <input placeholder="Tipo: Óleo, Pneu, etc" className="w-full border p-3 rounded-lg mb-3" value={modalState.maintenance.data.type || ''} onChange={e => handleModalChange('maintenance', 'type', e.target.value)} />
            <input type="number" step="0.01" placeholder="Custo R$" className="w-full border p-3 rounded-lg mb-4" value={modalState.maintenance.data.cost || ''} onChange={e => handleModalChange('maintenance', 'cost', e.target.value)} />
            <button onClick={saveMaintenance} className="w-full bg-orange-600 text-white py-3 rounded-lg font-semibold">Salvar Manutenção</button>
          </Modal>
        </div>
      );
    }

    function load() {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }
    load();
  </script>
</body>
</html>
