<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Moto Control</title>
  <style>
    /* Estilos fixos para layout sem sidebar */
    :root{--bg:#0b0f19;--panel:#131a26;--card:#1c2533;--text:#eaf1ff;--muted:rgba(234,241,255,.65);--accent:#2b6dff;--line:rgba(255,255,255,.08);--radius:18px;}
    body{margin:0;color:var(--text);font-family:sans-serif;background:var(--bg);}
    .app{min-height:100vh;padding-bottom:100px;}
    .main{padding:16px;}
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;}
    .label{color:var(--muted);font-size:11px;}
    .val{font-size:18px;font-weight:700;margin-top:6px;}
    .footer-clean{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:20px;padding:12px 22px;background:rgba(19,26,38,.95);border:1px solid var(--line);border-radius:30px;z-index:999;backdrop-filter:blur(10px);}
    .footer-clean button{border:none;background:none;color:var(--muted);font-size:20px;cursor:pointer;}
    .footer-clean button.active{color:var(--text);transform:translateY(-2px);}
    .view{display:none;}
    .view.active{display:block;}
  </style>
</head>
<body>

<div class="app">
  <main class="main">
    <div style="margin-bottom: 20px;">
        <h1 id="pageTitle" style="font-size:20px;">Painel</h1>
        <select id="globalVehicle"></select>
    </div>

    <section class="view active" id="view-painel">
      <div class="cards">
        <div class="card"><div class="label">Média</div><div class="val" id="kmlGeral">--</div></div>
        <div class="card"><div class="label">Prox. Abast. (Est.)</div><div class="val" id="proxAbast">--</div></div>
        <div class="card"><div class="label">Total Gasto</div><div class="val" id="totalGasto">R$ 0</div></div>
        <div class="card"><div class="label">Km Atual</div><div class="val" id="kmAtual">0</div></div>
      </div>
    </section>
  </main>

  <nav class="footer-clean">
    <button data-view="painel" class="active">🏠</button>
    <button data-view="abastecer">⛽</button>
    <button data-view="historico">🧾</button>
    <button data-view="manutencao">🔧</button>
  </nav>
</div>

<script>
// --- SUA LÓGICA DE DADOS (Copie seu JS original e adicione a função abaixo) ---
// Certifique-se de que a variável 'items' e 'activeVehicle' estejam carregadas antes.

function calcularProximoAbastecimento() {
    // Filtra os abastecimentos do veículo ativo
    const filtered = items.filter(x => x.veiculo === activeVehicle).sort((a,b) => new Date(a.data) - new Date(b.data));
    
    if(filtered.length >= 2) {
        const ultimo = filtered[filtered.length - 1];
        const penultimo = filtered[filtered.length - 2];
        
        const dias = Math.max(1, (new Date(ultimo.data) - new Date(penultimo.data)) / (1000 * 60 * 60 * 24));
        const kmRodados = ultimo.odometro - penultimo.odometro;
        const kmPorDia = kmRodados / dias;
        
        // Estimativa: Tanque cheio (ex: 6 litros) * média do veículo
        const autonomiaTanque = 150; 
        const diasEstimados = Math.round(autonomiaTanque / Math.max(0.1, kmPorDia));
        document.getElementById("proxAbast").textContent = diasEstimados + " dias";
    } else {
        document.getElementById("proxAbast").textContent = "--";
    }
}

// ADICIONE ISSO dentro da sua função renderAll() existente:
// calcularProximoAbastecimento();

// E adicione este código no final do script para o menu rodapé:
document.querySelectorAll('.footer-clean button').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + btn.dataset.view).classList.add('active');
        document.querySelectorAll('.footer-clean button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    };
});
</script>
</body>
</html>
