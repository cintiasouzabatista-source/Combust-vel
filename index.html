<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuelTrack Lead</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root {--primary: #2563eb; --bg: #f1f5f9; --card: #fff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --danger: #ef4444; --warn: #f59e0b;}
body.dark {--bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --border: #334155;}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
.container { max-width: 600px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
h1 { font-size: 20px; margin-bottom: 12px; }
h3 { font-size: 16px; margin-bottom: 8px; }
p { color: var(--muted); font-size: 14px; }
.muted { color: var(--muted); font-size: 13px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
input, select, button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; }
.btn { background: var(--primary); color: #fff; border: none; font-weight: 600; cursor: pointer; }
.btn-danger { background: var(--danger); }
.kpi p { font-size: 13px; margin-bottom: 4px; }
.kpi h3 { font-size: 22px; }
.kpi.destaque { border: 2px solid var(--primary); }
.kpi.warn { border: 2px solid var(--warn); background: rgba(245,158,11,0.1); }
.kpi.danger { border: 2px solid var(--danger); background: rgba(239,68,68,0.1); }
.tab-content { display: none; }
.tab-content.active { display: block; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; }
.btn-nav { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; }
.btn-nav.active { color: var(--primary); }
.theme-toggle { position: absolute; top: 16px; right: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.odometro-destaque { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 14px 16px; margin-bottom: 12px; }
.odometro-destaque h1 { font-size: 28px; font-weight: 700; }
.btn-ajuste { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px; border-radius: 50%; width: 38px; height: 38px; cursor: pointer; }
.dias-semana { display: flex; gap: 6px; flex-wrap: wrap; }
.dia-btn { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); cursor: pointer; }
.dia-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.alerta-bar { padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; font-size: 14px; font-weight: 600; display: none; }
.alerta-bar.warn { display: block; background: rgba(245,158,11,0.2); color: var(--warn); border: 1px solid var(--warn); }
.alerta-bar.danger { display: block; background: rgba(239,68,68,0.2); color: var(--danger); border: 1px solid var(--danger); }
</style>
</head>
<body>
<div class="container">
    <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
    <h1>FuelTrack Lead</h1>
    <div id="painel" class="tab-content active">
        <div id="alertaBar" class="alerta-bar"></div>
        <div class="card odometro-destaque">
            <div style="display:flex; justify-content:space-between; align-items:center">
                <div><p>Odômetro Virtual</p><h1 id="odometroVirtual">0 km</h1><p id="proxAtualizacao" style="opacity:0.8">Atualiza hoje 19:00</p></div>
                <button class="btn-ajuste" onclick="ajustarOdometro()"><i class="fas fa-sliders-h"></i></button>
            </div>
        </div>
        <div class="grid-2">
            <div class="card kpi"><p>Média Real</p><h3 id="mediaReal">0 km/l</h3></div>
            <div class="card kpi"><p>Gasto Total</p><h3 id="gastoTotal">R$ 0,00</h3></div>
        </div>
        <div class="grid-2">
            <div class="card kpi"><p>Último Abastecimento</p><h3 id="ultimoKmAbast">0 km</h3></div>
            <div class="card kpi destaque" id="cardAutonomia"><p>Autonomia</p><h3 id="autonomia">0km ~ 0 dias</h3></div>
        </div>
        <div class="card kpi" id="cardOleo"><p>Próxima Troca de Óleo</p><h3 id="proxTrocaOleo">0 km</h3><p class="muted" id="faltaOleo">Faltam 0 km</p></div>
        <div class="card"><h3>Consumo km/l por mês</h3><canvas id="graficoConsumo"></canvas></div>
    </div>
    <div id="abastecer" class="tab-content">
        <div class="card"><h3>Novo Abastecimento</h3>
            <input id="aData" type="date"><input id="aKm" type="number" placeholder="Km">
            <div class="grid-2"><input id="aLitros" type="number" step="0.01" placeholder="Litros" oninput="calcTotal()"><input id="aValorL" type="number" step="0.01" placeholder="R$ / L" oninput="calcTotal()"></div>
            <input id="aTotal" type="number" step="0.01" placeholder="Total R$" readonly>
            <button class="btn" onclick="addAbast()" style="margin-top:10px">Salvar</button>
        </div>
        <div class="card"><h3>Histórico</h3><div id="listaAbast"></div></div>
    </div>
    <div id="manutencao" class="tab-content">
        <div class="card"><h3>Adicionar Manutenção</h3>
            <input id="mData" type="date"><input id="mKm" type="number" placeholder="Km"><input id="mTipo" type="text" placeholder="Ex: Troca Óleo">
            <input id="mValor" type="number" step="0.01" placeholder="Valor R$"><input id="mProxKm" type="number" placeholder="Próxima em X km">
            <button class="btn" onclick="addManut()" style="margin-top:10px">Salvar</button>
        </div>
        <div class="card"><h3>Histórico</h3><div id="listaManut"></div></div>
    </div>
    <div id="config" class="tab-content">
        <div class="card"><h3>Configurações</h3>
            <label>Ponto de Partida</label>
            <div class="grid-2"><input id="kmBase" type="number" onchange="salvarConfig()"><input id="dataBase" type="datetime-local" onchange="salvarConfig()"></div>
            <div class="grid-3" id="modoKm" style="margin:10px 0">
                <button type="button" data-modo="dia">Dia</button><button type="button" data-modo="semana">Sem</button><button type="button" data-modo="mes">Mês</button>
            </div>
            <input id="kmValor" type="number" onchange="salvarConfig()">
        </div>
    </div>
</div>
<nav class="bottom-nav">
    <button class="btn-nav active" onclick="showTab('painel', this)"><i class="fas fa-gauge-high"></i><span>Painel</span></button>
    <button class="btn-nav" onclick="showTab('abastecer', this)"><i class="fas fa-gas-pump"></i><span>Abastecer</span></button>
    <button class="btn-nav" onclick="showTab('manutencao', this)"><i class="fas fa-wrench"></i><span>Manut</span></button>
    <button class="btn-nav" onclick="showTab('config', this)"><i class="fas fa-gear"></i><span>Config</span></button>
</nav>

<script>
let abastecimentos = JSON.parse(localStorage.getItem('abast') || '[]');
let manutencoes = JSON.parse(localStorage.getItem('manut') || '[]');
let config = JSON.parse(localStorage.getItem('config') || '{"kmBase":0,"dataBase":"' + new Date().toISOString().slice(0,16) + '","modoKm":"dia","kmValor":30,"horaAtualizacao":"19:00","diasSemana":[0,1,2,3,4,5,6]}');
let grafico;

function showTab(id, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
    if(id === 'abastecer') document.getElementById('aKm').value = calcularOdometroVirtual();
}

function calcTotal() {
    const l = parseFloat(document.getElementById('aLitros').value) || 0;
    const v = parseFloat(document.getElementById('aValorL').value) || 0;
    document.getElementById('aTotal').value = (l * v).toFixed(2);
}

function salvar() { localStorage.setItem('abast', JSON.stringify(abastecimentos)); localStorage.setItem('manut', JSON.stringify(manutencoes)); atualizarPainel(); }

function renderGrafico() {
    const ctx = document.getElementById('graficoConsumo').getContext('2d');
    if(grafico) grafico.destroy();
    const data = abastecimentos.slice(-5).map(a => a.litros > 0 ? (a.km / a.litros).toFixed(1) : 0);
    grafico = new Chart(ctx, { type: 'bar', data: { labels: abastecimentos.slice(-5).map(a => a.data), datasets: [{ label: 'km/l', data: data, backgroundColor: '#2563eb' }] } });
}

function atualizarPainel() {
    const kmVirtual = calcularOdometroVirtual();
    document.getElementById('odometroVirtual').innerText = kmVirtual + ' km';
    renderGrafico();
}

function calcularOdometroVirtual() { return config.kmBase + 100; /* Lógica simplificada para teste */ }
function toggleTheme() { document.body.classList.toggle('dark'); }
document.addEventListener('DOMContentLoaded', atualizarPainel);
</script>
</body>
</html>
