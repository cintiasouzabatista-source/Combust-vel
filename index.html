<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelTrack Lead</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f1f5f9; --card: #fff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --danger: #ef4444; --warn: #f59e0b; }
        body.dark { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --border: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
        .container { max-width: 600px; margin: 0 auto; padding: 16px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
        h1 { font-size: 20px; margin-bottom: 12px; }
        h3 { font-size: 16px; margin-bottom: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        input, select, button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; }
        .btn { background: var(--primary); color: #fff; border: none; font-weight: 600; cursor: pointer; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; }
        .btn-nav { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; }
        .btn-nav.active { color: var(--primary); }
        .dias-semana { display: flex; justify-content: space-between; gap: 2px; }
        .dia-btn { padding: 8px 4px; font-size: 12px; border: 1px solid var(--border); background: var(--card); cursor: pointer; }
        .dia-btn.active { background: var(--primary); color: #fff; }
        .action-btns { display: flex; gap: 8px; }
        .icon-btn { width: auto; padding: 8px; cursor: pointer; border: none; background: none; }
    </style>
</head>
<body>
<div class="container">
    <div id="painel" class="tab-content active"><h1>Painel</h1></div>

    <div id="veiculo" class="tab-content">
        <div class="card"><h3>Cadastrar Veículo</h3>
            <input id="vTipo" type="text" placeholder="Tipo (Moto/Carro)" style="margin-bottom:10px">
            <div class="grid-2">
                <input id="vAno" type="number" placeholder="Ano">
                <input id="vModelo" type="text" placeholder="Modelo">
            </div>
            <input id="vKm" type="number" placeholder="Km Atual" style="margin:10px 0">
            <input id="vDataAq" type="date">
            <button class="btn" style="margin-top:10px" onclick="salvarVeiculo()">Salvar Veículo</button>
        </div>
    </div>

    <div id="abastecer" class="tab-content">
        <div class="card"><h3>Novo Abastecimento</h3>
            <input id="aData" type="date" style="margin-bottom:10px">
            <input id="aKm" type="number" placeholder="Km odômetro" style="margin-bottom:10px">
            <select id="aCombustivel" style="margin-bottom:10px"><option value="Gasolina">Gasolina</option><option value="Álcool">Álcool</option></select>
            <div class="grid-2">
                <input id="aLitros" type="number" step="0.01" placeholder="Litros" oninput="calcularTotal()">
                <input id="aValorL" type="number" step="0.01" placeholder="R$ / L" oninput="calcularTotal()">
            </div>
            <input id="aTotal" type="number" step="0.01" placeholder="Total R$" readonly style="margin-top:10px">
            <button class="btn" style="margin-top:10px" onclick="addAbast()">Salvar</button>
        </div>
        <div class="card"><h3>Histórico</h3><div id="listaAbast"></div></div>
    </div>

    <div id="manutencao" class="tab-content">
        <div class="card"><h3>Manutenção</h3>
            <input id="mData" type="date" style="margin-bottom:10px">
            <input id="mTipo" type="text" placeholder="Serviço" style="margin-bottom:10px">
            <input id="mValor" type="number" step="0.01" placeholder="Valor R$" style="margin-bottom:10px">
            <button class="btn" onclick="addManut()">Salvar</button>
        </div>
        <div class="card"><h3>Histórico</h3><div id="listaManut"></div></div>
    </div>
</div>

<nav class="bottom-nav">
    <button class="btn-nav active" onclick="showTab('painel')"><i class="fas fa-gauge"></i><span>Painel</span></button>
    <button class="btn-nav" onclick="showTab('veiculo')"><i class="fas fa-car"></i><span>Veículo</span></button>
    <button class="btn-nav" onclick="showTab('abastecer')"><i class="fas fa-gas-pump"></i><span>Abastecer</span></button>
    <button class="btn-nav" onclick="showTab('manutencao')"><i class="fas fa-wrench"></i><span>Manutenção</span></button>
</nav>

<script>
function showTab(id) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
function calcularTotal() {
    const l = parseFloat(document.getElementById('aLitros').value) || 0;
    const v = parseFloat(document.getElementById('aValorL').value) || 0;
    document.getElementById('aTotal').value = (l * v).toFixed(2);
}
function salvarVeiculo() { alert('Veículo salvo!'); }
function addAbast() { renderLista('listaAbast', 'Abastecimento salvo'); }
function addManut() { renderLista('listaManut', 'Manutenção salva'); }
function renderLista(id, msg) {
    const div = document.getElementById(id);
    div.innerHTML += `<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #eee">
        <span>${msg}</span>
        <div class="action-btns">
            <button class="icon-btn" onclick="alert('Editar')"><i class="fas fa-pencil"></i></button>
            <button class="icon-btn"><i class="fas fa-trash"></i></button>
        </div>
    </div>`;
}
</script>
</body>
</html>
