<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Garagem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

<header>
    <h1><i class="fas fa-car"></i> Garagem</h1>
    <select id="selectVeiculo" onchange="mudarVeiculo()"></select>
    <button onclick="toggleTheme()"><i id="theme-icon" class="fas fa-moon"></i></button>
</header>

<nav class="tabs">
    <button class="active" onclick="trocarAba('painel')">Painel</button>
    <button onclick="trocarAba('abastecer')">Abastecer</button>
    <button onclick="trocarAba('manutencao')">Manutenção</button>
    <button onclick="trocarAba('veiculos')">Veículos</button>
</nav>

<main>
    <section id="painel" class="aba active">
        <div class="kpi-grid">
            <div class="card"><p>Média</p><h2 id="mediaGeral">0 km/L</h2></div>
            <div class="card"><p>Total Gasto</p><h2 id="totalGasto">R$ 0,00</h2></div>
            <div class="card"><p>Km Atual</p><h2 id="kmAtual">0 km</h2></div>
            <div class="card"><p>Próx. Troca</p><h2 id="proxOleo">-</h2></div>
        </div>
        <div class="card">
            <h3>Últimos Abastecimentos</h3>
            <div id="listaPainel"></div>
        </div>
    </section>

    <section id="abastecer" class="aba">
        <div class="card">
            <input id="aData" type="date">
            <input id="aKm" type="number" placeholder="Km">
            <input id="aLitros" type="number" placeholder="Litros">
            <input id="aTotal" type="number" placeholder="Total R$">
            <button class="btn" onclick="addAbast()">Salvar Abastecimento</button>
        </div>
        <div id="listaAbast"></div>
    </section>

    <section id="manutencao" class="aba">
        <div class="card">
            <input id="mTipo" type="text" placeholder="Tipo (ex: Troca de óleo)">
            <input id="mKm" type="number" placeholder="Km">
            <input id="mCusto" type="number" placeholder="Custo R$">
            <input id="mObs" type="text" placeholder="Observação">
            <button class="btn" onclick="addManut()">Salvar Manutenção</button>
        </div>
        <div id="listaManut"></div>
    </section>

    <section id="veiculos" class="aba">
        <div class="card">
            <h3>Cadastrar Veículo</h3>
            <input id="vNome" type="text" placeholder="Apelido (ex: Meu Carro)">
            <input id="vAnoModelo" type="text" placeholder="Ano/Modelo (ex: 2022/2023)">
            <input id="vKmInicial" type="number" placeholder="Km inicial de aquisição">
            <input id="vDataAquisicao" type="date">
            <button class="btn" onclick="addVeiculo()">+ Salvar Veículo</button>
        </div>
        <div id="listaVeiculos"></div>
        <div class="card" style="margin-top: 20px;">
            <button class="btn-del" onclick="resetarApp()">Resetar Todo o App</button>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
