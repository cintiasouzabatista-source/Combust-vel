<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Controle de Combustível & Manutenção</title>

  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --card: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --line: rgba(255, 255, 255, 0.05);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --danger-dim: rgba(239, 68, 68, 0.1);
      --ok: #10b981;
      --warning: #f59e0b;
      --radius-lg: 12px;
      --radius-md: 8px;
      --sideW: 240px;
    }

    [data-theme="light"] {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --card: #f9fafb;
      --text: #111827;
      --muted: #6b7280;
      --line: rgba(0, 0, 0, 0.06);
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app { display: flex; width: 100%; }

    /* Sidebar Sidebar Modern */
    .sidebar {
      width: var(--sideW);
      background: var(--panel);
      padding: 32px 16px;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      transform: translateX(-102%);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2500;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--line);
    }
    .sidebar.open { transform: translateX(0); }
    
    .brand { padding-bottom: 32px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
    .brand .t { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    .brand .s { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .nav { display: flex; flex-direction: column; gap: 6px; }
    .nav button {
      width: 100%; border-radius: var(--radius-md); border: none;
      background: transparent; color: var(--muted);
      padding: 12px; cursor: pointer; font-weight: 500; font-size: 13px;
      text-align: left; display: flex; align-items: center; gap: 10px;
      transition: all 0.15s;
    }
    .nav button:hover { color: var(--text); background: var(--line); }
    .nav button.active { background: var(--card); color: var(--text); font-weight: 600; }

    .theme-toggle-box { padding-top: 16px; border-top: 1px solid var(--line); }
    .theme-toggle-box button { background: transparent; border: none; color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; padding: 4px; width: 100%; text-align: left; }
    .theme-toggle-box button:hover { color: var(--text); }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); display: none; z-index: 2400; }
    .overlay.show { display: block; }

    /* Main Container */
    .main { width: 100%; padding: 24px 16px; margin-left: 0; }
    
    @media (min-width: 980px) {
      .sidebar { transform: translateX(0); position: sticky; background: var(--panel); }
      .overlay { display: none !important; }
      .main { padding: 40px 48px; max-width: 1200px; margin: 0 auto; }
      .topbar .menuBtn { display: none; }
    }

    /* Topbar Modern e Responsiva */
    .topbar { 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
      margin-bottom: 32px; 
    }
    .topbar-header { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .menuBtn { background: transparent; border: none; color: var(--text); font-size: 20px; cursor: pointer; }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }

    /* Seletor de Veículo Destaque Premium */
    .selector-box { 
      background: rgba(59, 130, 246, 0.08); 
      padding: 10px 16px; 
      border-radius: var(--radius-lg); 
      border: 1px solid rgba(59, 130, 246, 0.2); 
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .selector-box label { 
      font-size: 10px; 
      text-transform: uppercase; 
      letter-spacing: 0.8px; 
      color: var(--accent); 
      font-weight: 700; 
      margin-bottom: 2px; 
    }
    .selector-wrapper { position: relative; width: 100%; }
    .selector-box select {
      width: 100%; border: none; background: transparent; color: var(--text);
      font-size: 14px; font-weight: 600; outline: none; cursor: pointer; appearance: none; padding: 4px 24px 4px 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' fill='%233b82f6'><path d='M0 2h10L5 8z'/></svg>");
      background-repeat: no-repeat; background-position: right center;
    }

    @media (min-width: 640px) {
      .topbar { flex-direction: row; align-items: center; justify-content: space-between; }
      .topbar-header { width: auto; }
      .selector-box { margin-bottom: 0; }
    }

    /* Sections */
    .section { display: none; animation: fadeIn 0.15s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
    
    .sectionTitle { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }

    /* Dashboard Cards */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .card { background: var(--panel); border-radius: var(--radius-lg); padding: 24px; border: 1px solid var(--line); }
    .card .label { color: var(--muted); font-size: 12px; font-weight: 500; }
    .card .val { font-size: 26px; font-weight: 700; margin-top: 8px; letter-spacing: -0.5px; }
    .card .small { color: var(--muted); font-size: 11px; margin-top: 6px; }

    /* Premium Form Architecture */
    .clean-form-container { max-width: 600px; margin: 0 auto; background: var(--panel); border-radius: var(--radius-lg); padding: 32px; border: 1px solid var(--line); }
    
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 24px; }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 480px) { .form-row-2 { grid-template-columns: 1fr; } }

    .input-card {
      background: var(--card);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      border: 1px solid transparent;
      transition: border-color 0.15s;
    }
    .input-card:focus-within { border-color: var(--accent); }
    .input-card label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
    
    .input-card input, .input-card select {
      width: 100%; border: none; background: transparent; color: var(--text);
      padding: 4px 0; outline: none; font-size: 15px; font-weight: 500;
    }
    .input-card input::placeholder { color: var(--muted); opacity: 0.4; }

    /* Inline Cost Preview */
    .cost-preview-box {
      background: rgba(16, 185, 129, 0.06);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ok);
      text-align: center;
      margin-bottom: 24px;
      border: 1px solid rgba(16, 185, 129, 0.15);
    }

    /* Buttons Configuration */
    .btn {
      width: 100%; padding: 14px; font-size: 14px; font-weight: 600; border-radius: var(--radius-md);
      cursor: pointer; border: none; transition: background 0.15s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn.primary { background: var(--accent); color: #ffffff; }
    .btn.primary:hover { background: var(--accent-hover); }
    
    .compact-actions-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
    .btn.secondary { background: var(--card); color: var(--text); font-size: 11px; padding: 10px; border: 1px solid var(--line); }
    .btn.secondary:hover { background: var(--line); }

    .import-zone { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .file-input-wrapper { position: relative; width: 100%; }
    .file-input-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

    .danger-zone { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); text-align: center; }
    .btn.danger-text { background: transparent; color: var(--muted); font-size: 12px; padding: 6px; width: auto; display: inline-block; }
    .btn.danger-text:hover { color: var(--danger); }

    .btn.mini { padding: 6px 10px; font-size: 12px; border-radius: 6px; background: var(--card); color: var(--text); width: auto; border: 1px solid var(--line); }
    .btn.mini:hover { background: var(--line); }
    .btn.mini.danger:hover { background: var(--danger-dim); color: var(--danger); border-color: transparent; }

    /* Table Design */
    .table-responsive { width: 100%; overflow-x: auto; background: var(--panel); border-radius: var(--radius-lg); border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 16px; font-size: 13px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    td { font-weight: 500; }
    tr:last-child td { border-bottom: none; }

    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .badge.ok { background: rgba(16, 185, 129, 0.1); color: var(--ok); }
    .badge.warning { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
    .badge.danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

    .statusLine { font-size: 12px; color: var(--muted); margin-top: 12px; text-align: right; }

    /* Vehicle List Modern */
    .v-list { display: flex; flex-direction: column; gap: 10px; }
    .v-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--panel); border-radius: var(--radius-lg); border: 1px solid var(--line); }
    .v-item .name { font-weight: 600; font-size: 14px; }
    .v-item .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    #toast {
      position: fixed; bottom: 24px; right: 24px; background: var(--card); color: #fff;
      padding: 12px 20px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid var(--line); display: none; z-index: 9999;
    }
    .maint-container { display: flex; flex-direction: column; gap: 32px; }
  </style>
</head>

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div>
      <div class="brand">
        <div class="t">Garage</div>
        <div class="s">Controle de Combustível</div>
      </div>

      <nav class="nav" aria-label="Menu">
        <button class="active" data-view="painel"><span>Painel</span></button>
        <button data-view="abastecer" id="nav-abastecer"><span>Abastecer</span></button>
        <button data-view="historico"><span>Histórico</span></button>
        <button data-view="manutencao"><span>Manutenção</span></button>
        <button data-view="veiculos"><span>Veículos</span></button>
      </nav>
    </div>

    <div class="theme-toggle-box">
      <button id="btnThemeToggle" type="button">🌓Modo Claro ou Escuro</button>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">
    <div class="topbar">
      <div class="topbar-header">
        <button class="menuBtn" id="menuBtn">☰ &nbsp;</button>
        <div>
          <h1 id="pageTitle">Painel</h1>
          <div class="subtitle" id="pageSub">Métricas essenciais</div>
        </div>
      </div>
      
      <div class="selector-box" id="globalVehiclesContainer">
        <label for="globalVehicle">Veículo Ativo</label>
        <div class="selector-wrapper">
          <select id="globalVehicle"></select>
        </div>
      </div>
    </div>

    <section class="section view" id="view-painel" style="display:block">
      <div class="cards">
        <div class="card">
          <div class="label">Média Geral</div>
          <div class="val" id="kmlGeral">—</div>
          <div class="small">Km/L total</div>
        </div>
        <div class="card">
          <div class="label">Último Lançamento</div>
          <div class="val" id="ultimoAbastecido">—</div>
          <div class="small">litros inseridos</div>
        </div>
        <div class="card">
          <div class="label">Total Acumulado</div>
          <div class="val" id="totalGasto">—</div>
          <div class="small">investimento total</div>
        </div>
        <div class="card">
          <div class="label">Km Atual</div>
          <div class="val" id="kmAtual">—</div>
          <div class="small">último odômetro</div>
        </div>
      </div>
    </section>

    <section class="section view" id="view-abastecer">
      <div class="clean-form-container">
        <div class="sectionTitle" id="form
