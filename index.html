<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Odômetro Lead 110</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;--line:#334155}
body.light{--bg:#f8fafc;--card:#ffffff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
html,body{margin:0;padding:0;height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background.2s,color.2s}
.wrap{max-width:680px;margin:0 auto;padding:0 12px 100px;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:20px 0 16px;border-bottom:1px solid var(--line);margin-bottom:20px}
header h1{flex:1;font-size:22px;margin:0;font-weight:700}
header select{max-width:140px;padding:10px 12px;font-size:14px}
.icon-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text);padding:4px 6px;line-height:1}
header select{flex:1;max-width:200px;padding:12px;font-size:14px}
select,input,button{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15px}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px rgba(59,130,246,0.2)}
.btn{background:var(--accent);color:#fff;font-weight:700;border:none;cursor:pointer}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);cursor:pointer}
.btn-small{padding:8px 12px;font-size:13px;border:none;border-radius:8px;cursor:pointer}
.btn-edit{background:var(--accent);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.grid{display:grid;gap:10px}.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:18px;text-align:center}.kpi.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}.kpi.val{font-size:28px;font-weight:800;margin-top:6px}
.item{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.item-actions{display:flex;gap:6px}
.badge{font-size:11px;padding:4px 8px;border-radius:8px;background:rgba(34,197,94,.2);color:var(--ok);font-weight:700}
.badge.warn{background:rgba(245,158,11,.2);color:var(--warn)}
.badge.danger{background:rgba(239,68,68,.2);color:var(--danger)}
.footer{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:12px;padding:12px 20px;background:var(--card);border:1px solid var(--line);border-radius:24px;z-index:10;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.footer button{border:none;background:none;font-size:24px;color:var(--muted);cursor:pointer}.footer button.active{color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal.active{display:flex}.modal-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.label{font-size:12px;color:var(--muted);margin-bottom:6px;display:block}
.chart-container{position:relative;height:240px;margin-top:12px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.alert{border-left:4px solid var(--warn)}.urgent{border-left:4px solid var(--danger);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}
.info-card{background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(59,130,246,.06));border-color:rgba(59,130,246,.3)}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.dias-semana{display:flex;gap:6px;margin:8px 0}.dia-btn{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:12px;cursor:pointer}
.dia-btn.active{background:var(--accent);color:#fff}
.section{scroll-behavior:smooth}
</style>
</head>
<body>
<div class="wrap" id="swipeArea">
  <header>
    <h1 id="title">Odômetro</h1>
    <select id="selVeiculo"></select>
    <button class="icon-btn" id="btnTema" style="display:none">🌗</button>
  </header>

  <section id="painel" class="section">
    <div class="kpis">
      <div class="card kpi"><div class="label">Média Real</div><div class="val" id="kml">--</div></div>
      <div class="card kpi"><div class="label">Gasto Total</div><div class="val" id="gasto">R$ 0</div></div>
      <div class="card kpi"><div class="label">Km Atual</div><div class="val" id="kmAtual">0 km</div></div>
      <div class="card kpi info-card" id="cardAbast"><div class="label">Autonomia</div><div class="val" id="proxAbast">--</div></div>
      <div class="card kpi" id="cardOleo"><div class="label">Próx Troca Óleo</div><div class="val" id="proxOleo">--</div></div>
    </div>
    <div class="card"><h3 style="margin-top:0">Consumo km/l por mês</h3><div class="chart-container"><canvas id="graficoConsumo"></canvas></div></div>
  </section>

  <section id="abastecer" class="section" style="display:none">
    <button class="btn" onclick="openModal('abast')">+ Novo Abastecimento</button>
    <div id="listaAbast" style="margin-top:14px"></div>
  </section>

  <section id="manutencao" class="section" style="display:none">
    <button class="btn" onclick="openModal('manut')">+ Nova Manutenção</button>
    <div id="listaManut" style="margin-top:14px"></div>
  </section>

  <section id="veiculos" class="section" style="display:none">
    <button class="btn" onclick="openModal('veiculo')">+ Novo Veículo</button>
    <div id="listaVeiculos" style="margin-top:14px"></div>
  </section>

  <section id="config" class="section" style="display:none">
    <div class="card">
      <h2 style="margin-top:0">⚙️ Configurações</h2>
      <label class="label">Modo km/mês ou km/dia</label>
      <select id="cfgModoKm">
        <option value="dia">Km/dia + dias da semana</option>
        <option value="mes">Km/mês</option>
      </select>

      <div id="cfgDiasSemana" style="margin-top:12px">
        <label class="label">Dias que roda na semana</label>
        <div class="dias-semana">
          <button class="dia-btn" data-dia="1">Seg</button>
          <button class="dia-btn" data-dia="2">Ter</button>
          <button class="dia-btn" data-dia="3">Qua</button>
          <button class="dia-btn" data-dia="4">Qui</button>
          <button class="dia-btn" data-dia="5">Sex</button>
          <button class="dia-btn" data-dia="6">Sáb</button>
          <button class="dia-btn" data-dia="0">Dom</button>
        </div>
      </div>

      <div id="cfgKmDiaWrap">
        <label class="label" style="margin-top:12px">Km por dia</label>
        <input id="cfgKmDia" type="number" value="30">
      </div>

      <div id="cfgKmMesWrap" style="display:none">
        <label class="label" style="margin-top:12px">Km por mês</label>
        <input id="cfgKmMes" type="number" value="900">
      </div>

      <label class="label" style="margin-top:16px">Alerta óleo - km antes</label>
      <input id="cfgAlertaOleo" type="number" value="300">

      <label class="label" style="margin-top:16px">Notificações</label>
      <button class="btn-ghost" onclick="ativarNotificacoes()">🔔 Ativar Alertas</button>

      <h3 style="margin-top:20px">💾 Backup</h3>
      <button onclick="exportarJSON()" class="btn" style="margin-bottom:8px;width:100%">📤 Exportar</button>
      <label class="btn btn-ghost" style="width:100%;display:block;text-align:center;cursor:pointer">📥 Importar<input type="file" id="importFile" accept=".json" style="display:none" onchange="importarJSON(event)"></label>
    </div>
  </section>
</div>

<nav class="footer">
  <button onclick="show('painel')" class="active">🚟</button>
  <button onclick="show('abastecer')">⛽</button>
  <button onclick="show('manutencao')">🔧</button>
  <button onclick="show('veiculos')">🛞</button>
  <button onclick="show('config')">⚙️</button>
</nav>

<div class="modal" id="modal-veiculo">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;margin-bottom:16px"><h3 id="tituloVeiculo">Cadastrar Veículo</h3></div>
    <input type="hidden" id="vId">
    <label class="label">Modelo</label><input id="vNome" placeholder="Honda Lead 110">
    <div class="grid grid-2"><div><label class="label">Ano</label><input id="vAno" type="number" value="2010"></div><div><label class="label">Data Aquisição</label><input id="vData" type="date"></div></div>
    <div class="grid grid-3"><div><label class="label">Km compra</label><input id="vKmCompra" type="number"></div><div><label class="label">Tanque L</label><input id="vTanque" type="number" step="0.1"></div><div><label class="label">Km reserva</label><input id="vReserva" type="number" step="0.1"></div></div>
    <div class="modal-actions"><button class="btn-ghost" onclick="closeModal('veiculo')">Cancelar</button><button class="btn" onclick="saveVeiculo()">Salvar</button></div>
  </div>
</div>

<div class="modal" id="modal-abast">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;margin-bottom:16px"><h3 id="tituloAbast">⛽ Abastecimento</h3></div>
    <input type="hidden" id="aId">
    <label class="label">Data</label><input id="aData" type="date">
    <label class="label">Km Odômetro</label><input id="aKm" type="number">
    <div class="grid grid-2"><div><label class="label">Litros</label><input id="aLitros" type="number" step="0.01"></div><div><label class="label">R$/L</label><input id="aValorL" type="number" step="0.001"></div></div>
    <label class="label">Total R$</label><input id="aTotal" readonly>
    <div class="modal-actions"><button class="btn-ghost" onclick="closeModal('abast')">Cancelar</button><button class="btn" onclick="saveAbast()">Salvar</button></div>
  </div>
</div>

<div class="modal" id="modal-manut">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;margin-bottom:16px"><h3 id="tituloManut">🔧 Manutenção</h3></div>
    <input type="hidden" id="mId">
    <label class="label">Data</label><input id="mData" type="date">
    <label class="label">Tipo</label><input id="mTipo" placeholder="Troca de óleo">
    <div class="grid grid-2"><div><label class="label">Km da troca</label><input id="mKm" type="number"></div><div><label class="label">Intervalo km</label><input id="mIntervalo" type="number"></div></div>
    <label class="label">Valor R$</label><input id="mValor" type="number" step="0.01">
    <div class="modal-actions"><button class="btn-ghost" onclick="closeModal('manut')">Cancelar</button><button class="btn" onclick="saveManut()">Salvar</button></div>
  </div>
</div>

<script>
const KEY='combApp';
const $=id=>document.getElementById(id);
let db={veiculos:[],abastecimentos:[],manutencoes:[],ativo:null,tema:'dark',modoKm:'dia',kmDiaPadrao:30,kmMesPadrao:900,diasSemana:[1,2,3,4,5],alertaOleoKm:300};
let grafico=null;
let abaAtual='painel';
let startX=0;

document.addEventListener('DOMContentLoaded', load);

function load(){
  const raw=localStorage.getItem(KEY);
  if(raw) db=JSON.parse(raw);

  const hoje=new Date().toISOString().split('T')[0];
  if($('vData')) $('vData').value=hoje;
  if($('aData')) $('aData').value=hoje;
  if($('mData')) $('mData').value=hoje;

  renderVeiculosSelect();
  renderAll();
  applyTheme();
  setupSwipe();
  setupDiasSemana();

  $('btnTema').onclick=toggleTema;
  $('cfgModoKm').value=db.modoKm;
  $('cfgModoKm').onchange=e=>{db.modoKm=e.target.value; atualizarCfgKm(); save(); renderAll()}
  $('cfgKmDia').value=db.kmDiaPadrao;
  $('cfgKmDia').onchange=e=>{db.kmDiaPadrao=+e.target.value; save(); renderAll()}
  $('cfgKmMes').value=db.kmMesPadrao;
  $('cfgKmMes').onchange=e=>{db.kmMesPadrao=+e.target.value; save(); renderAll()}
  $('cfgAlertaOleo').value=db.alertaOleoKm;
  $('cfgAlertaOleo').onchange=e=>{db.alertaOleoKm=+e.target.value; save(); renderAll()}
  atualizarCfgKm();
}

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function applyTheme(){
  document.documentElement.classList.toggle('light', db.tema==='light');
  $('btnTema').style.display=abaAtual==='painel'?'block':'none';
}

function toggleTema(){
  db.tema=db.tema==='dark'?'light':'dark'; 
  applyTheme(); 
  save();
  setTimeout(renderGrafico,50); // atualiza cores do gráfico também
}

function setupSwipe(){
  const area=$('swipeArea');
  area.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});
  area.addEventListener('touchend',e=>{
    const endX=e.changedTouches[0].clientX;
    const diff=endX-startX;
    if(Math.abs(diff)>60){
      const abas=['painel','abastecer','manutencao','veiculos','config'];
      let idx=abas.indexOf(abaAtual);
      if(diff<0 && idx<abas.length-1) idx++;
      if(diff>0 && idx>0) idx--;
      show(abas[idx]);
    }
  },{passive:true});
}

function show(t){
  abaAtual=t;
  ['painel','abastecer','manutencao','veiculos','config'].forEach(s=>$(s).style.display='none');
  $(t).style.display='block';
  document.querySelectorAll('.footer button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.footer button')[['painel','abastecer','manutencao','veiculos','config'].indexOf(t)].classList.add('active');
  $('title').textContent=t.charAt(0).toUpperCase()+t.slice(1);
  applyTheme(); // <- adiciona esta linha
  if(t=='painel') setTimeout(renderGrafico,200);
  window.scrollTo({top:0,behavior:'smooth'});
}

function setupDiasSemana(){
  document.querySelectorAll('.dia-btn').forEach(btn=>{
    const dia=+btn.dataset.dia;
    btn.classList.toggle('active', db.diasSemana.includes(dia));
    btn.onclick=()=>{
      btn.classList.toggle('active');
      db.diasSemana=Array.from(document.querySelectorAll('.dia-btn.active')).map(b=>+b.dataset.dia);
      save(); renderAll();
    }
  });
}

function atualizarCfgKm(){
  const modo=db.modoKm;
  $('cfgDiasSemana').style.display=modo==='dia'?'block':'none';
  $('cfgKmDiaWrap').style.display=modo==='dia'?'block':'none';
  $('cfgKmMesWrap').style.display=modo==='mes'?'block':'none';
}

function openModal(tipo, id=null){
  $(`modal-${tipo}`).classList.add('active');
  limparCampos(tipo);
  if(id) carregarEdicao(tipo, id);
  if(tipo=='abast'){
    const calc=()=>$('aTotal').value=((parseFloat($('aLitros').value)||0)*(parseFloat($('aValorL').value)||0)).toFixed(2);
    $('aLitros').oninput=calc; $('aValorL').oninput=calc;
  }
}
function closeModal(tipo){$(`modal-${tipo}`).classList.remove('active')}

function limparCampos(tipo){
  if(tipo=='veiculo'){ $('vId').value=''; $('tituloVeiculo').textContent='Cadastrar Veículo'; $('vNome').value=''; $('vAno').value='2010'; $('vKmCompra').value=''; $('vTanque').value=''; $('vReserva').value=''; }
  if(tipo=='abast'){ $('aId').value=''; $('tituloAbast').textContent='⛽ Abastecimento'; $('aData').value=new Date().toISOString().split('T')[0]; $('aKm').value=''; $('aLitros').value=''; $('aValorL').value=''; $('aTotal').value=''; }
  if(tipo=='manut'){ $('mId').value=''; $('tituloManut').textContent='🔧 Manutenção'; $('mData').value=new Date().toISOString().split('T')[0]; $('mTipo').value=''; $('mKm').value=''; $('mIntervalo').value='4000'; $('mValor').value=''; }
}

function carregarEdicao(tipo, id){
  if(tipo=='veiculo'){
    const v=db.veiculos.find(x=>x.id==id);
    $('vId').value=v.id; $('tituloVeiculo').textContent='Editar Veículo';
    $('vNome').value=v.nome; $('vAno').value=v.ano; $('vData').value=v.dataAquisicao;
    $('vKmCompra').value=v.kmCompra; $('vTanque').value=v.tanque; $('vReserva').value=v.reserva;
  }
  if(tipo=='abast'){
    const a=db.abastecimentos.find(x=>x.id==id);
    $('aId').value=a.id; $('tituloAbast').textContent='Editar Abastecimento';
    $('aData').value=a.data; $('aKm').value=a.km; $('aLitros').value=a.litros; $('aValorL').value=a.valorL; $('aTotal').value=a.valor;
  }
  if(tipo=='manut'){
    const m=db.manutencoes.find(x=>x.id==id);
    $('mId').value=m.id; $('tituloManut').textContent='Editar Manutenção';
    $('mData').value=m.data; $('mTipo').value=m.tipo; $('mKm').value=m.km; $('mIntervalo').value=m.intervalo; $('mValor').value=m.valor;
  }
}

function renderVeiculosSelect(){
  $('selVeiculo').innerHTML=db.veiculos.map(v=>`<option value="${v.id}" ${v.id==db.ativo?'selected':''}>${v.nome}</option>`).join('');
  $('selVeiculo').onchange=e=>{db.ativo=+e.target.value; save(); renderAll();}
}

function saveVeiculo(){
  if(!$('vNome').value.trim()) return alert('Preencha modelo');
  const id=$('vId').value;
  const obj={nome:$('vNome').value,ano:+$('vAno').value||2010,dataAquisicao:$('vData').value,kmCompra:+$('vKmCompra').value||0,tanque:+$('vTanque').value||6.5,reserva:+$('vReserva').value||1};
  if(id){Object.assign(db.veiculos.find(v=>v.id==+id), obj)} else {obj.id=Date.now(); db.veiculos.push(obj); db.ativo=obj.id}
  save(); closeModal('veiculo'); renderVeiculosSelect(); renderAll();
}

function saveAbast(){
  if(!$('aData').value||!$('aKm').value||!$('aLitros').value) return alert('Preencha tudo');
  const id=$('aId').value;
  const obj={veiculo:db.ativo,data:$('aData').value,km:+$('aKm').value,litros:+$('aLitros').value,valor:+$('aTotal').value,valorL:+$('aValorL').value};
  if(id){Object.assign(db.abastecimentos.find(a=>a.id==+id), obj)} else {obj.id=Date.now(); db.abastecimentos.push(obj)}
  save(); closeModal('abast'); renderAll(); verificarAlertas();
}

function saveManut(){
  if(!$('mTipo').value.trim()||!$('mKm').value) return alert('Preencha tipo e km');
  const id=$('mId').value;
  const obj={veiculo:db.ativo,data:$('mData').value,tipo:$('mTipo').value,km:+$('mKm').value,intervalo:+$('mIntervalo').value||4000,proxKm:+$('mKm').value+(+$('mIntervalo').value||4000),valor:+$('mValor').value||0};
  if(id){Object.assign(db.manutencoes.find(m=>m.id==+id), obj)} else {obj.id=Date.now(); db.manutencoes.push(obj)}
  save(); closeModal('manut'); renderAll(); verificarAlertas();
}

function getKmAtual(v){
  const abs=db.abastecimentos.filter(a=>a.veiculo==v.id).sort((a,b)=>new Date(b.data)-new Date(a.data))[0];
  return abs? abs.km : v.kmCompra;
}

function getMediaKmL(v){
  const abs=db.abastecimentos.filter(a=>a.veiculo==v.id).sort((a,b)=>new Date(a.data)-new Date(b.data));
  if(abs.length<2) return 42;
  let km=0,litros=0;
  for(let i=1;i<abs.length;i++){km+=abs[i].km-abs[i-1].km; litros+=abs[i].litros}
  return litros>0? km/litros : 42;
}

function getKmDia(){
  if(db.modoKm==='mes') return db.kmMesPadrao/30;
  return db.kmDiaPadrao;
}

function renderAll(){
  if(!db.ativo||!db.veiculos.length) return;
  const v=db.veiculos.find(x=>x.id==db.ativo);
  const abs=db.abastecimentos.filter(a=>a.veiculo==db.ativo).sort((a,b)=>new Date(a.data)-new Date(b.data));
  const kmAtual=getKmAtual(v);
  const media=getMediaKmL(v);
  $('kmAtual').textContent=kmAtual+' km';
  $('kml').textContent=media.toFixed(1)+' km/l';
  $('gasto').textContent='R$ '+abs.reduce((s,a)=>s+a.valor,0).toFixed(2);

  const autonomia=media*v.tanque;
  const kmDia=getKmDia();
  const diasFaltam=Math.floor(autonomia/kmDia);
  $('proxAbast').textContent=`${autonomia.toFixed(0)}km ~ ${diasFaltam} dias`;

  if(autonomia<=40){$('cardAbast').className='card kpi urgent';$('proxAbast').innerHTML=`${autonomia.toFixed(0)}km <span class="badge danger">RESERVA!</span>`} else {$('cardAbast').className='card kpi info-card'}

  const manutOleo=db.manutencoes.filter(m=>m.veiculo==db.ativo&&m.tipo.toLowerCase().includes('óleo')).sort((a,b)=>b.km-a.km)[0];
  if(manutOleo){
    const faltam=manutOleo.proxKm-kmAtual;
    if(faltam<=db.alertaOleoKm){$('cardOleo').className='card kpi urgent';$('proxOleo').innerHTML=`${faltam}km <span class="badge danger">TROCAR!</span>`} else {$('cardOleo').className='card kpi';$('proxOleo').textContent=faltam+'km'}
  }
  renderAbast(); renderManut(); renderVeiculos(); renderGrafico();
}

function renderGrafico(){
  const canvas=$('graficoConsumo');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  if(!ctx) return;

  const v=db.veiculos.find(x=>x.id==db.ativo);
  const abs=db.abastecimentos.filter(a=>a.veiculo==v.id).sort((a,b)=>new Date(a.data)-new Date(b.data));

  if(grafico){grafico.destroy(); grafico=null;}

  if(abs.length<2){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.font='14px sans-serif';
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted');
    ctx.textAlign='center';
    ctx.fillText('Cadastre 2+ abastecimentos para ver o gráfico', canvas.width/2, canvas.height/2);
    return;
  }

  const dados=[];
  for(let i=1;i<abs.length;i++){
    const km=abs[i].km-abs[i-1].km;
    const kml=km/abs[i].litros;
    const mes=abs[i].data.substring(0,7);
    dados.push({mes,kml});
  }

  const meses=[...new Set(dados.map(d=>d.mes))];
  const medias=meses.map(m=>{
    const vals=dados.filter(d=>d.mes==m).map(d=>d.kml);
    return vals.reduce((a,b)=>a+b,0)/vals.length;
  });

  const gridColor=db.tema==='dark'?'rgba(148,163,184,0.2)':'rgba(100,116,139,0.2)';
  const textColor=db.tema==='dark'?'#94a3b8':'#64748b';

  grafico=new Chart(ctx,{
    type:'line',
    data:{
      labels:meses.map(m=>m.split('-')[1]+'/'+m.split('-')[0]),
      datasets:[{
        label:'km/l',
        data:medias,
        borderColor:'#3b82f6',
        backgroundColor:'rgba(59,130,246,0.1)',
        borderWidth:2.5,
        tension:0.3,
        fill:true,
        pointRadius:6,
        pointBackgroundColor:'#3b82f6',
        pointBorderColor:'#fff',
        pointBorderWidth:2
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        y:{beginAtZero:false,grid:{color:gridColor},ticks:{color:textColor,font:{size:11}}},
        x:{grid:{color:gridColor},ticks:{color:textColor,font:{size:11}}}
      }
    }
  });
}
function renderAbast(){
  const list=db.abastecimentos.filter(a=>a.veiculo==db.ativo).sort((a,b)=>new Date(b.data)-new Date(a.data));
  $('listaAbast').innerHTML=list.length? list.map(a=>`<div class="item"><div><b>${a.data.split('-').reverse().join('/')}</b><br><small>${a.km}km • ${a.litros}L • R$${a.valorL.toFixed(3)}/L • R$${a.valor.toFixed(2)}</small></div><div class="item-actions"><button class="btn-small btn-edit" onclick="openModal('abast',${a.id})">✏️</button><button class="btn-small btn-danger" onclick="delAbast(${a.id})">🗑️</button></div></div>`).join(''):'<div class="empty">Sem abastecimentos</div>';
}

function renderManut(){
  const v=db.veiculos.find(x=>x.id==db.ativo);
  const kmAtual=getKmAtual(v);
  const list=db.manutencoes.filter(m=>m.veiculo==db.ativo).sort((a,b)=>new Date(b.data)-new Date(a.data));
  $('listaManut').innerHTML=list.length? list.map(m=>{
    const faltam=m.proxKm-kmAtual;
    const cls=faltam<=db.alertaOleoKm?'urgent':'';
    const badge=faltam<=db.alertaOleoKm?'<span class="badge danger">TROCAR!</span>':'';
    return `<div class="item ${cls}"><div><b>${m.tipo}</b> ${badge}<br><small>Feito ${m.km}km • Próxima ${m.proxKm}km • Faltam ${faltam}km</small></div><div class="item-actions"><button class="btn-small btn-edit" onclick="openModal('manut',${m.id})">✏️</button><button class="btn-small btn-danger" onclick="delManut(${m.id})">🗑️</button></div></div>`;
  }).join(''):'<div class="empty">Sem manutenções</div>';
}

function renderVeiculos(){
  $('listaVeiculos').innerHTML=db.veiculos.length? db.veiculos.map(v=>`<div class="item ${v.id==db.ativo?'alert':''}"><div><b>${v.nome}</b> ${v.id==db.ativo?'<span class="badge">Ativo</span>':''}<br><small>Ano ${v.ano} • Km compra ${v.kmCompra}km</small></div><div class="item-actions"><button class="btn-small btn-edit" onclick="openModal('veiculo',${v.id})">✏️</button><button class="btn-small btn-danger" onclick="delVeiculo(${v.id})">🗑️</button></div></div>`).join(''):'<div class="empty">Sem veículos</div>';
}

function delAbast(id){if(confirm('Excluir?')){db.abastecimentos=db.abastecimentos.filter(a=>a.id!=id); save(); renderAll()}}
function delManut(id){if(confirm('Excluir?')){db.manutencoes=db.manutencoes.filter(m=>m.id!=id); save(); renderAll()}}
function delVeiculo(id){if(confirm('Excluir veículo e todos dados?')){db.veiculos=db.veiculos.filter(v=>v.id!=id); db.abastecimentos=db.abastecimentos.filter(a=>a.veiculo!=id); db.manutencoes=db.manutencoes.filter(m=>m.veiculo!=id); db.ativo=db.veiculos[0]?.id||null; save(); renderVeiculosSelect(); renderAll()}}

function pedirPermissaoNotificacao(){if('Notification' in window && Notification.permission==='default'){Notification.requestPermission()}}
function ativarNotificacoes(){pedirPermissaoNotificacao(); alert('Alertas ativados!'); verificarAlertas()}
function verificarAlertas(){
  if(Notification.permission!=='granted') return;
  const v=db.veiculos.find(x=>x.id==db.ativo);
  const kmAtual=getKmAtual(v);
  const media=getMediaKmL(v);
  const autonomia=media*v.tanque;
  if(autonomia<=40){new Notification('⛽ RESERVA!', {body:`Tanque com só ${autonomia.toFixed(0)}km. Abastece logo!`})}
  const manutOleo=db.manutencoes.filter(m=>m.veiculo==db.ativo&&m.tipo.toLowerCase().includes('óleo')).sort((a,b)=>b.km-a.km)[0];
  if(manutOleo && manutOleo.proxKm-kmAtual<=db.alertaOleoKm){new Notification('🔧 Troca de Óleo!', {body:`Faltam ${manutOleo.proxKm-kmAtual}km pra troca`})}
}

function exportarJSON(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
}
function importarJSON(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      if(confirm('Substituir dados?')){
        db=JSON.parse(ev.target.result);
        save(); location.reload();
      }
    }catch{alert('Arquivo inválido!')}
  };
  reader.readAsText(file);
}
