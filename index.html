<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Frota</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root { --primary: #2563eb; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --border: #334155; --danger: #ef4444; --warning: #facc15; }
body.estrada { --primary: #ea580c; --bg: #1c1917; --card: #292524; --text: #fafaf9; --muted: #a8a29e; --border: #44403c; }
body.white { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui; background: var(--bg); color: var(--text); padding-bottom: 80px; transition: 0.3s; position: relative; }
.container { max-width: 600px; margin: 0 auto; padding: 16px; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px }
.header-actions { display: flex; gap: 8px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-icon { background: var(--card); border: 1px solid var(--border); padding: 10px 12px; border-radius: 10px; cursor: pointer; color: var(--text); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; text-decoration: none; }
.btn-icon.small { padding: 6px 8px; font-size: 13px; width: auto; }
input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-top: 4px; font-size: 14px; }
label { font-size: 11px; color: var(--muted); font-weight: 600; display: block; margin-top: 6px; }
.kpi p { color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.kpi h3 { font-size: 24px; font-weight: 700; }
.odometro { background: linear-gradient(135deg, var(--primary), #1d4ed8); border: none; color: #fff; padding: 12px 16px; }
.odometro p { color: rgba(255,255,255,0.9); font-size: 11px; margin-bottom: 4px; }
.odometro-header { display:flex; justify-content:space-between; align-items:center }
.odometro h3 { font-size: 20px; }
.odometro small { color: rgba(255,255,255,0.8); font-size: 11px; }

.nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 50; }
.nav-btn { background: none; border: none; color: var(--muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: 20%; }
.nav-btn.active { color: var(--primary); }
.modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:100 }
.modal-content { background:var(--card); padding:16px; border-radius:16px; width:92%; max-width:480px; max-height:90vh; overflow-y:auto }
.modal-actions { display:flex; gap:8px; margin-top:12px }

.accordion-grupo { margin-bottom: 8px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--bg); }
.accordion-header { padding: 10px 14px; background: var(--card); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 13px; color: var(--text); user-select: none; }
.accordion-body { padding: 12px; display: none; border-top: 1px solid var(--border); }
.accordion-grupo.aberto .accordion-body { display: block; }

.historico-item { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor:pointer; transition: 0.2s; }
.historico-item:hover { border-color: var(--primary); }
.historico-resumo { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
.historico-detalhes { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
.historico-item.expandido .historico-detalhes { display: block; }
.total-display { font-weight:700; font-size:18px; color:var(--primary); margin-top:8px }
.view-section { display: none; }
.view-section.active { display: block; }

.chart-horiz-row { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; height: 38px; position: relative; }
.chart-horiz-bar { background: var(--primary); height: 100%; display: flex; align-items: center; padding: 0 10px; color: #fff; font-weight: 700; font-size: 12px; white-space: nowrap; gap: 6px; }
.chart-horiz-info { position: absolute; right: 12px; font-size: 12px; color: var(--muted); font-weight: 600; z-index: 2; pointer-events: none; }
.analise-box { font-size: 13px; line-height: 1.5; color: var(--text); }
</style>
</head>
<body class="dark">

<div class="container">
    <div class="header">
        <h1>Controle Frota</h1>
        <div class="header-actions">
            <button class="btn-icon" style="width: auto;" onclick="trocarTema()"><i id="iconTema" class="fas fa-palette"></i></button>
        </div>
    </div>
    
    <!-- ABA INÍCIO -->
    <div id="viewInicio" class="view-section active">
        <select id="selectVeiculo" class="card" style="width:100%; padding:12px; font-size:16px; margin-bottom:12px;" onchange="trocarVeiculo(this.value)"></select>

        <div class="grid-2" style="margin-bottom: 12px">
            <button class="btn-icon" onclick="abrirModalAbast()"><i class="fas fa-gas-pump"></i> Combustível</button>
            <button class="btn-icon" onclick="abrirModalManut()"><i class="fas fa-wrench"></i> Manutenção</button>
        </div>

        <div class="card odometro kpi">
            <div class="odometro-header">
                <div>
                    <p><i class="fas fa-road"></i> KM ATUAL</p>
                    <h3 id="kmRodados">0 km</h3>
                </div>
                <button class="btn-icon small" onclick="abrirModalKm()"><i class="fas fa-pen"></i></button>
            </div>
            <small id="consumoMedia">Consumo: -- km/L</small>
        </div>

        <div class="grid-2">
            <div class="card kpi"><p><i class="fas fa-gas-pump"></i> ABASTECIMENTO</p><h3 id="ultimoAbastData">--/--</h3><small id="ultimoAbastValor">R$ 0</small></div>
            <div class="card kpi"><p><i class="fas fa-oil-can"></i> TROCA ÓLEO</p><h3 id="ultimaTrocaData">--/--</h3><small id="ultimaTrocaKm">KM: -----</small></div>
        </div>
    </div>

    <!-- ABA GRÁFICOS -->
    <div id="viewGraficos" class="view-section">
        <div class="card" style="margin-bottom: 12px; padding: 12px;">
            <div class="grid-2">
                <div>
                    <label><i class="fas fa-filter"></i> Período</label>
                    <select id="filtroPeriodo" onchange="renderizarGraficos()">
                        <option value="todos">Todo o histórico</option>
                        <option value="semanal">Semanal</option>
                        <option value="mensal">Mensal</option>
                        <option value="semestral">Semestral</option>
                        <option value="anual">Anual</option>
                    </select>
                </div>
                <div>
                    <label><i class="fas fa-gas-pump"></i> Combustível</label>
                    <select id="filtroCombustivel" onchange="renderizarGraficos()">
                        <option value="todos">Todos</option>
                        <option value="Gasolina">Gasolina</option>
                        <option value="Etanol">Etanol</option>
                        <option value="Diesel">Diesel</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="card">
            <h3 style="margin-bottom: 12px; font-size: 15px;"><i class="fas fa-chart-line"></i> Eficiência de Consumo</h3>
            <div id="containerGraficoConsumo"></div>
        </div>
        <div class="card">
            <h3 style="margin-bottom: 12px; font-size: 15px;"><i class="fas fa-chart-bar"></i> Gastos por Abastecimento (R$)</h3>
            <div id="containerGraficoGastos"></div>
        </div>
    </div>
</div>

<nav class="nav-bottom">
    <button class="nav-btn active" onclick="mudarAba('Inicio', this)"><i class="fas fa-home"></i> Início</button>
    <button class="nav-btn" onclick="mudarAba('Graficos', this)"><i class="fas fa-chart-pie"></i> Gráficos</button>
    <button class="nav-btn" onclick="abrirModalHistorico()"><i class="fas fa-list"></i> Hist.</button>
    <button class="nav-btn" onclick="abrirModalVeiculo()"><i class="fas fa-motorcycle"></i> Veículos</button>
</nav>

<!-- MODAIS -->
<div id="modalKm" class="modal"><div class="modal-content"><h3>Atualizar KM</h3><label>KM Atual</label><input id="kmInput" type="number"><div class="modal-actions"><button onclick="fecharModalKm()" class="btn-icon">Cancelar</button><button onclick="salvarKm()" class="btn-icon" style="background:var(--primary); color:#fff">Salvar</button></div></div></div>

<div id="modalVeiculo" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom: 10px; font-size:16px;"><i class="fas fa-motorcycle"></i> Gerenciar Veículos</h3>
        <div class="accordion-grupo aberto" id="accNovo">
            <div class="accordion-header" onclick="alternarAccordion('accNovo')">
                <span><i class="fas fa-plus-circle"></i> Cadastrar Novo Veículo</span>
            </div>
            <div class="accordion-body" style="display:block;">
                <div class="grid-2">
                    <div><label>Tipo</label><select id="vTipo"><option value="moto">Moto</option><option value="carro">Carro</option></select></div>
                    <div><label>Nome</label><input id="vNome" placeholder="Ex: Honda Lead"></div>
                </div>
                <div class="grid-2">
                    <div><label>KM Atual / Aquisição</label><input id="vKmAquisicao" type="number" placeholder="Ex: 15230"></div>
                </div>
                <div class="modal-actions"><button onclick="salvarVeiculo()" class="btn-icon" style="background:var(--primary); color:#fff; width:100%;">Salvar Novo Veículo</button></div>
            </div>
        </div>
        <div class="modal-actions" style="margin-top:10px;"><button onclick="fecharModalVeiculo()" class="btn-icon" style="width:100%;">Fechar</button></div>
    </div>
</div>

<div id="modalHistorico" class="modal">
    <div class="modal-content">
        <h3>Histórico</h3>
        <div style="margin: 10px 0;">
            <div class="grid-2">
                <div>
                    <label><i class="fas fa-filter"></i> Período</label>
                    <select id="filtroHistoricoPeriodo" onchange="renderizarHistorico()">
                        <option value="todos">Todo o histórico</option>
                        <option value="semanal">Semanal</option>
                        <option value="mensal">Mensal</option>
                        <option value="semestral">Semestral</option>
                        <option value="anual">Anual</option>
                    </select>
                </div>
                <div>
                    <label><i class="fas fa-gas-pump"></i> Combustível</label>
                    <select id="filtroHistoricoCombustivel" onchange="renderizarHistorico()">
                        <option value="todos">Todos</option>
                        <option value="Gasolina">Gasolina</option>
                        <option value="Etanol">Etanol</option>
                        <option value="Diesel">Diesel</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="listaHistorico" style="margin-top:10px;"></div>
        <button onclick="fecharModalHistorico()" class="btn-icon" style="width:100%; margin-top:12px">Fechar</button>
    </div>
</div>

<div id="modalAbast" class="modal">
    <div class="modal-content">
        <h3 style="font-size: 16px; margin-bottom: 8px;">Novo Abastecimento</h3>
        <div class="grid-2">
            <div><label>Data</label><input id="aData" type="date"></div>
            <div><label>KM</label><input id="aKm" type="number"></div>
        </div>
        <div class="grid-2">
            <div><label>Combustível</label><select id="aCombustivel"><option value="Gasolina">Gasolina</option><option value="Etanol">Etanol</option><option value="Diesel">Diesel</option></select></div>
            <div><label>Litros</label><input id="aLitros" type="number" step="0.001" oninput="calcularTotal()"></div>
        </div>
        <div class="grid-2">
            <div><label>Valor/L (R$)</label><input id="aValor" type="number" step="0.01" oninput="calcularTotal()"></div>
            <div><label>Total (R$)</label><div class="total-display" id="aTotal" style="margin-top:4px; font-size:16px;">R$ 0,00</div></div>
        </div>
        <div class="modal-actions">
            <button onclick="fecharModalAbast()" class="btn-icon">Cancelar</button>
            <button onclick="salvarAbast()" class="btn-icon" style="background:var(--primary); color:#fff">Salvar</button>
        </div>
    </div>
</div>

<div id="modalManut" class="modal"><div class="modal-content"><h3>Nova Manutenção</h3><label>Data</label><input id="mData" type="date"><label>KM</label><input id="mKm" type="number"><label>Tipo</label><input id="mTipo" placeholder="Ex: Troca de Óleo"><label>Valor</label><input id="mValor" type="number"><div class="modal-actions"><button onclick="fecharModalManut()" class="btn-icon">Cancelar</button><button onclick="salvarManut()" class="btn-icon" style="background:var(--primary); color:#fff">Salvar</button></div></div></div>

<script>
const CHAVE_STORAGE = 'veiculos_frota_v15_2';
const CHAVE_ATIVO = 'veiculoAtivoId_frota_v15_2';

let veiculos = JSON.parse(localStorage.getItem(CHAVE_STORAGE) || '[]');
let veiculoAtivoId = localStorage.getItem(CHAVE_ATIVO) || null;
let tema = localStorage.getItem('tema_frota') || 'dark';

function aplicarTema() { document.body.className = tema; }
function trocarTema() { 
    tema = tema === 'dark' ? 'white' : 'dark'; 
    localStorage.setItem('tema_frota', tema); 
    aplicarTema(); 
}

function getVeiculoAtivo() { 
    if(!veiculoAtivoId && veiculos.length) { 
        veiculoAtivoId = veiculos[0].id; 
    } 
    return veiculos.find(v => v.id === veiculoAtivoId) || null; 
}

function atualizarSelectVeiculos() {
    const select = document.getElementById('selectVeiculo');
    if (!select) return;
    
    if (veiculos.length === 0) {
        select.innerHTML = '<option value="">Nenhum veículo cadastrado (Clique em Veículos)</option>';
        return;
    }

    select.innerHTML = veiculos.map(v => `<option value="${v.id}" ${v.id === veiculoAtivoId ? 'selected' : ''}>${v.nome} (${v.tipo})</option>`).join('');
}

function trocarVeiculo(id) {
    veiculoAtivoId = id;
    localStorage.setItem(CHAVE_ATIVO, id);
    atualizarDashboard();
}

function atualizarDashboard() {
    atualizarSelectVeiculos();
    const v = getVeiculoAtivo();
    if (!v) return;

    document.getElementById('kmRodados').innerText = (v.kmAtual || 0).toLocaleString() + ' km';
    
    if (v.abast && v.abast.length > 0) {
        const ultimo = v.abast[v.abast.length - 1];
        document.getElementById('ultimoAbastData').innerText = ultimo.data.split('-').reverse().join('/');
        document.getElementById('ultimoAbastValor').innerText = `R$ ${ultimo.total.toFixed(2)}`;
    } else {
        document.getElementById('ultimoAbastData').innerText = '--/--';
        document.getElementById('ultimoAbastValor').innerText = 'R$ 0';
    }

    if (v.manut && v.manut.length > 0) {
        const ultimaM = v.manut[v.manut.length - 1];
        document.getElementById('ultimaTrocaData').innerText = ultimaM.data.split('-').reverse().join('/');
        document.getElementById('ultimaTrocaKm').innerText = `KM: ${ultimaM.km.toLocaleString()}`;
    } else {
        document.getElementById('ultimaTrocaData').innerText = '--/--';
        document.getElementById('ultimaTrocaKm').innerText = 'KM: -----';
    }
}

// Funções de salvamento e modais
function abrirModalVeiculo() { document.getElementById('modalVeiculo').style.display = 'flex'; }
function fecharModalVeiculo() { document.getElementById('modalVeiculo').style.display = 'none'; }
function abrirModalAbast() { document.getElementById('modalAbast').style.display = 'flex'; document.getElementById('aData').valueAsDate = new Date(); }
function fecharModalAbast() { document.getElementById('modalAbast').style.display = 'none'; }
function abrirModalManut() { document.getElementById('modalManut').style.display = 'flex'; document.getElementById('mData').valueAsDate = new Date(); }
function fecharModalManut() { document.getElementById('modalManut').style.display = 'none'; }
function abrirModalKm() { document.getElementById('modalKm').style.display = 'flex'; }
function fecharModalKm() { document.getElementById('modalKm').style.display = 'none'; }
function abrirModalHistorico() { document.getElementById('modalHistorico').style.display = 'flex'; renderizarHistorico(); }
function fecharModalHistorico() { document.getElementById('modalHistorico').style.display = 'none'; }

function salvarVeiculo() {
    const nome = document.getElementById('vNome').value;
    if (!nome) return alert('Digite o nome do veículo');
    
    const novo = {
        id: 'v_' + Date.now(),
        tipo: document.getElementById('vTipo').value,
        nome: nome,
        kmAtual: Number(document.getElementById('vKmAquisicao').value) || 0,
        abast: [],
        manut: []
    };

    veiculos.push(novo);
    veiculoAtivoId = novo.id;
    localStorage.setItem(CHAVE_STORAGE, JSON.stringify(veiculos));
    localStorage.setItem(CHAVE_ATIVO, veiculoAtivoId);
    
    fecharModalVeiculo();
    atualizarDashboard();
}

function calcularTotal() {
    const litros = Number(document.getElementById('aLitros').value) || 0;
    const valor = Number(document.getElementById('aValor').value) || 0;
    document.getElementById('aTotal').innerText = `R$ ${(litros * valor).toFixed(2)}`;
}

function salvarAbast() {
    const v = getVeiculoAtivo();
    if (!v) return alert('Selecione um veículo primeiro!');

    const data = document.getElementById('aData').value;
    const km = Number(document.getElementById('aKm').value);
    const combustivel = document.getElementById('aCombustivel').value;
    const litros = Number(document.getElementById('aLitros').value);
    const valor = Number(document.getElementById('aValor').value);

    if (!data || !km || !litros || !valor) return alert('Preencha todos os campos!');

    v.abast.push({ data, km, combustivel, litros, valor, total: litros * valor });
    if (km > v.kmAtual) v.kmAtual = km;

    localStorage.setItem(CHAVE_STORAGE, JSON.stringify(veiculos));
    fecharModalAbast();
    atualizarDashboard();
}

function salvarManut() {
    const v = getVeiculoAtivo();
    if (!v) return alert('Selecione um veículo primeiro!');

    const data = document.getElementById('mData').value;
    const km = Number(document.getElementById('mKm').value);
    const tipo = document.getElementById('mTipo').value;
    const valor = Number(document.getElementById('mValor').value);

    if (!data || !km || !tipo || !valor) return alert('Preencha todos os campos!');

    v.manut.push({ data, km, tipo, valor });
    if (km > v.kmAtual) v.kmAtual = km;

    localStorage.setItem(CHAVE_STORAGE, JSON.stringify(veiculos));
    fecharModalManut();
    atualizarDashboard();
}

function salvarKm() {
    const v = getVeiculoAtivo();
    if (!v) return;
    const novoKm = Number(document.getElementById('kmInput').value);
    if (novoKm) {
        v.kmAtual = novoKm;
        localStorage.setItem(CHAVE_STORAGE, JSON.stringify(veiculos));
        fecharModalKm();
        atualizarDashboard();
    }
}

function filtrarPorPeriodoECombustivel(dados, periodoId, combustivelId) {
    const agora = new Date();
    return dados.filter(item => {
        if (combustivelId && combustivelId !== 'todos') {
            if (item.combustivel && item.combustivel !== combustivelId) return false;
        }
        if (!periodoId || periodoId === 'todos') return true;
        if (!item.data) return false;

        const dataItem = new Date(item.data + 'T00:00:00');
        const diffDias = (agora - dataItem) / (1000 * 60 * 60 * 24);

        if (periodoId === 'semanal' && diffDias > 7) return false;
        if (periodoId === 'mensal' && diffDias > 30) return false;
        if (periodoId === 'semestral' && diffDias > 180) return false;
        if (periodoId === 'anual' && diffDias > 365) return false;

        return true;
    });
}

function renderizarHistorico() {
    const v = getVeiculoAtivo();
    const container = document.getElementById('listaHistorico');
    if (!v) {
        container.innerHTML = '<p style="text-align:center; color:var(--muted);">Nenhum veículo selecionado.</p>';
        return;
    }

    const periodo = document.getElementById('filtroHistoricoPeriodo').value;
    const combustivel = document.getElementById('filtroHistoricoCombustivel').value;

    const abastFiltrados = filtrarPorPeriodoECombustivel(v.abast || [], periodo, combustivel);
    const manutFiltradas = filtrarPorPeriodoECombustivel(v.manut || [], periodo, 'todos');

    const todos = [
        ...abastFiltrados.map(a => ({ ...a, tipoReg: 'abast' })),
        ...manutFiltradas.map(m => ({ ...m, tipoReg: 'manut' }))
    ].sort((a,b) => b.data.localeCompare(a.data));

    let totalGeral = 0;
    abastFiltrados.forEach(a => totalGeral += (a.total || 0));
    manutFiltradas.forEach(m => totalGeral += (m.valor || 0));

    let htmlResumo = '';
    if (todos.length > 0) {
        htmlResumo = `
            <div style="background: var(--bg); border: 1px solid var(--border); padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <span style="font-size: 11px; color: var(--muted); display: block;">TOTAL DO FILTRO</span>
                    <strong style="font-size: 16px; color: var(--primary);">R$ ${totalGeral.toFixed(2)}</strong>
                </div>
                <div style="text-align: right;">
                    <span style="font-size: 11px; color: var(--muted); display: block;">REGISTROS</span>
                    <strong style="font-size: 14px;">${todos.length} itens</strong>
                </div>
            </div>
        `;
    }

    if (todos.length === 0) {
        container.innerHTML = htmlResumo + '<p style="text-align:center; color:var(--muted); padding:10px;">Nenhum registro encontrado.</p>';
        return;
    }

    let htmlItens = todos.map(item => {
        const dataFmt = item.data.split('-').reverse().join('/');
        if (item.tipoReg === 'abast') {
            return `
                <div class="historico-item" onclick="this.classList.toggle('expandido')">
                    <div class="historico-resumo">
                        <span><i class="fas fa-gas-pump" style="color:var(--primary);"></i> Abastecimento (${dataFmt})</span>
                        <span>R$ ${item.total.toFixed(2)}</span>
                    </div>
                    <div class="historico-detalhes">
                        <p>KM: ${item.km} | Litros: ${item.litros}L</p>
                        <p>Preço do Litro: R$ ${item.valor.toFixed(2)}</p>
                    </div>
                </div>`;
        } else {
            return `
                <div class="historico-item" onclick="this.classList.toggle('expandido')">
                    <div class="historico-resumo">
                        <span><i class="fas fa-wrench" style="color:var(--warning);"></i> ${item.tipo} (${dataFmt})</span>
                        <span>R$ ${item.valor.toFixed(2)}</span>
                    </div>
                    <div class="historico-detalhes">
                        <p>KM: ${item.km}</p>
                    </div>
                </div>`;
        }
    }).join('');

    container.innerHTML = htmlResumo + htmlItens;
}

function renderizarGraficos() {
    const v = getVeiculoAtivo();
    if (!v) return;

    const periodo = document.getElementById('filtroPeriodo').value;
    const combustivel = document.getElementById('filtroCombustivel').value;

    const abastFiltrados = filtrarPorPeriodoECombustivel(v.abast || [], periodo, combustivel)
        .sort((a, b) => a.data.localeCompare(b.data));

    const containerConsumo = document.getElementById('containerGraficoConsumo');
    const containerGastos = document.getElementById('containerGraficoGastos');

    if (abastFiltrados.length === 0) {
        containerConsumo.innerHTML = '<p style="text-align:center; color:var(--muted); font-size:13px;">Sem dados para exibir.</p>';
        containerGastos.innerHTML = '<p style="text-align:center; color:var(--muted); font-size:13px;">Sem dados para exibir.</p>';
        return;
    }

    let htmlConsumo = '';
    let htmlGastos = '';

    abastFiltrados.forEach((item, index, arr) => {
        if (index > 0) {
            const kmRodados = item.km - arr[index - 1].km;
            const consumo = item.litros > 0 ? (kmRodados / item.litros).toFixed(2) : 0;
            const larguraBarra = Math.min(Math.max((consumo / 35) * 100, 10), 100);

            htmlConsumo += `
                <div class="chart-horiz-row">
                    <div class="chart-horiz-bar" style="width: ${larguraBarra}%;">${item.data.split('-').reverse().join('/')}</div>
                    <div class="chart-horiz-info">${consumo} km/L</div>
                </div>
            `;
        }

        const larguraGasto = Math.min(Math.max((item.total / 100) * 100, 10), 100);
        htmlGastos += `
            <div class="chart-horiz-row">
                <div class="chart-horiz-bar" style="width: ${larguraGasto}%; background:var(--warning);">${item.data.split('-').reverse().join('/')}</div>
                <div class="chart-horiz-info">R$ ${item.total.toFixed(2)}</div>
            </div>
        `;
    });

    containerConsumo.innerHTML = htmlConsumo || '<p style="text-align:center; color:var(--muted); font-size:13px;">Necessário 2+ abastecimentos para cálculo de consumo.</p>';
    containerGastos.innerHTML = htmlGastos;
}

function mudarAba(nomeAba, el) {
    document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('view' + nomeAba).classList.add('active');
    if(el) el.classList.add('active');
    if(nomeAba === 'Graficos') renderizarGraficos();
}

aplicarTema();
atualizarDashboard();
</script>
