<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Controle de Combustível & Manutenção</title>

  <style>
    :root {
      --bg: #0b0f19;
      --panel: #0b0f19;
      --card: #131926;
      --text: #f9fafb;
      --muted: #9ca3af;
      --line: rgba(255, 255, 255, 0.04);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --danger-dim: rgba(239, 68, 68, 0.1);
      --ok: #10b981;
      --warning: #f59e0b;
      --radius-lg: 12px;
      --radius-md: 8px;
      --sideW: 240px;
    }

    [data-theme="light"] {
      --bg: #f4f5f7;
      --panel: #f4f5f7;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: rgba(0, 0, 0, 0.04);
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app { display: flex; width: 100%; background: var(--bg); }

    /* Sidebar Sidebar Modern */
    .sidebar {
      width: var(--sideW);
      background: var(--card);
      padding: 32px 16px;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      transform: translateX(-102%);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2500;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--line);
    }
    .sidebar.open { transform: translateX(0); }
    
    .brand { padding-bottom: 32px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
    .brand .t { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    .brand .s { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .nav { display: flex; flex-direction: column; gap: 6px; }
    .nav button {
      width: 100%; border-radius: var(--radius-md); border: none;
      background: transparent; color: var(--muted);
      padding: 12px; cursor: pointer; font-weight: 500; font-size: 13px;
      text-align: left; display: flex; align-items: center; gap: 10px;
      transition: all 0.15s;
    }
    .nav button:hover { color: var(--text); background: var(--line); }
    .nav button.active { background: var(--line); color: var(--text); font-weight: 600; }

    .theme-toggle-box { padding-top: 16px; border-top: 1px solid var(--line); }
    .theme-toggle-box button { background: transparent; border: none; color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; padding: 4px; width: 100%; text-align: left; }
    .theme-toggle-box button:hover { color: var(--text); }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; z-index: 2400; }
    .overlay.show { display: block; }

    /* Main Container */
    .main { width: 100%; padding: 24px 16px; margin-left: 0; background: var(--bg); }
    
    @media (min-width: 980px) {
      .sidebar { transform: translateX(0); position: sticky; background: var(--card); }
      .overlay { display: none !important; }
      .main { padding: 40px 48px; max-width: 1200px; margin: 0 auto; }
      .topbar .menuBtn { display: none; }
    }

    /* Topbar Modern e Responsiva */
    .topbar { 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
      margin-bottom: 32px; 
    }
    .topbar-header { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .menuBtn { background: transparent; border: none; color: var(--text); font-size: 20px; cursor: pointer; }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }

    /* Seletor de Veículo Destaque Premium */
    .selector-box { 
      background: rgba(59, 130, 246, 0.06); 
      padding: 10px 16px; 
      border-radius: var(--radius-lg); 
      border: 1px solid rgba(59, 130, 246, 0.15); 
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .selector-box label { 
      font-size: 10px; 
      text-transform: uppercase; 
      letter-spacing: 0.8px; 
      color: var(--accent); 
      font-weight: 700; 
      margin-bottom: 2px; 
    }
    .selector-wrapper { position: relative; width: 100%; }
    .selector-box select {
      width: 100%; border: none; background: transparent; color: var(--text);
      font-size: 14px; font-weight: 600; outline: none; cursor: pointer; appearance: none; padding: 4px 24px 4px 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' fill='%233b82f6'><path d='M0 2h10L5 8z'/></svg>");
      background-repeat: no-repeat; background-position: right center;
    }

    @media (min-width: 640px) {
      .topbar { flex-direction: row; align-items: center; justify-content: space-between; }
      .topbar-header { width: auto; }
      .selector-box { margin-bottom: 0; }
    }

    .section { display: none; animation: fadeIn 0.15s ease-out forwards; }

    .sectionTitle { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }

    /* Dashboard Cards */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }

    .card .label { color: var(--muted); font-size: 12px; font-weight: 500; }
    .card .val { font-size: 26px; font-weight: 700; margin-top: 8px; letter-spacing: -0.5px; }
    .card .small { color: var(--muted); font-size: 11px; margin-top: 6px; }

    /* Premium Form Architecture */
    .clean-form-container { max-width: 600px; margin: 0 auto; background: var(--card); border-radius: var(--radius-lg); padding: 32px; border: 1px solid var(--line); }
    
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 24px; }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 480px) { .form-row-2 { grid-template-columns: 1fr; } }

    .input-card {
      background: var(--bg);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      border: 1px solid transparent;
      transition: border-color 0.15s;
    }
    .input-card:focus-within { border-color: var(--accent); }
    .input-card label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
    
    .input-card input, .input-card select {
      width: 100%; border: none; background: transparent; color: var(--text);
      padding: 4px 0; outline: none; font-size: 15px; font-weight: 500;
    }
    .input-card input::placeholder { color: var(--muted); opacity: 0.4; }

    /* Inline Cost Preview */
    .cost-preview-box {
      background: rgba(16, 185, 129, 0.05);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ok);
      text-align: center;
      margin-bottom: 24px;
      border: 1px solid rgba(16, 185, 129, 0.12);
    }

    /* Buttons Configuration */
    .btn {
      width: 100%; padding: 14px; font-size: 14px; font-weight: 600; border-radius: var(--radius-md);
      cursor: pointer; border: none; transition: background 0.15s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn.primary { background: var(--accent); color: #ffffff; }
    .btn.primary:hover { background: var(--accent-hover); }
    
    .compact-actions-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
    .btn.secondary { background: var(--bg); color: var(--text); font-size: 11px; padding: 10px; border: 1px solid var(--line); }
    .btn.secondary:hover { background: var(--line); }

    /* Import Zone */
    .import-zone { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .file-label-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; background: var(--bg); color: var(--text); font-size: 11px; padding: 10px; 
      border: 1px solid var(--line); border-radius: var(--radius-md); cursor: pointer; transition: background 0.15s;
      font-weight: 500; text-align: center;
    }
    .file-label-btn:hover { background: var(--line); }
    .file-label-btn input[type="file"] { display: none; }

    .danger-zone { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); text-align: center; }
    .btn.danger-text { background: transparent; color: var(--muted); font-size: 12px; padding: 6px; width: auto; display: inline-block; }
    .btn.danger-text:hover { color: var(--danger); }

    .btn.mini { padding: 6px 10px; font-size: 12px; border-radius: 6px; background: var(--bg); color: var(--text); width: auto; border: 1px solid var(--line); }
    .btn.mini:hover { background: var(--line); }
    .btn.mini.danger:hover { background: var(--danger-dim); color: var(--danger); border-color: transparent; }

    .table-responsive { width: 100%; overflow-x: auto; background: var(--card); border-radius: var(--radius-lg);
