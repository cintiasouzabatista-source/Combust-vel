<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Combustível App</title>
<style>
:root{
  --bg:#0b1120;--card:#131c2f;--text:#e2e8f0;--muted:#94a3b8;
  --accent:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;--line:#1e293b;
}
body.light{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#cbd5e1}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{margin:0;background:var(--bg);color:var(--text);transition:.2s}
.wrap{max-width:680px;margin:0 auto;padding:16px 12px 100px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
header h1{flex:1;font-size:20px;margin:0;font-weight:700}
select,input,button{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15px}
input::placeholder{color:var(--muted)}
button{cursor:pointer;font-weight:700;border:none}
.btn{background:var(--accent);color:#fff;font-size:16px}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-danger{background:var(--danger);color:#fff}
.grid{display:grid;gap:10px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1fr 1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card h3{margin:0 0 12px;font-size:16px;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:16px;text-align:center}
.kpi.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi.val{font-size:26px;font-weight:800;margin-top:6px}
.item{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.item b{font-size:15px}
.item small{color:var(--muted);font-size:13px;line-height:1.4}
.actions{display:flex;gap:8px}
.actions button{padding:8px 12px;font-size:14px;width:auto;border-radius:8px}
.badge{font-size:11px;padding:4px 8px;border-radius:8px;background:rgba(34,197,94,.2);color:var(--ok);font-weight:700}
.badge.warn{background:rgba(245,158,11,.2);color:var(--warn)}
.badge.danger{background:rgba(239,68,68,.2);color:var(--danger)}
.footer{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:12px;padding:12px 20px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.footer button{border:none;background:none;font-size:24px;color:var(--muted)}
.footer button.active{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:999}
.modal.active{display:flex}
.modal-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:420px}
.modal-box h3{margin:0 0 16px;font-size:18px}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.alert{border-left:4px solid var(--warn)}
.urgent{border-left:4px solid var(--danger)}
.label{font-size:12px;color:var(--muted);margin-bottom:6px;display:block}
.info-card{background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(59,130,246,.05));border-color:rgba(59,130,246,.3)}
.dias-semana{display:flex;gap:6px;margin:8px 0}
.dia-btn{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:12px;cursor:pointer}
.dia-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Painel</h1>
    <select id="selVeiculo"></select>
  </header>

  <!-- PAINEL -->
  <section id="painel">
    <div class="card info-card">
      <small style="color:var(--muted)">💡 Km Atual atualiza só nos dias que você roda. Próximo abastecimento baseado na autonomia</small>
    </div>
    <div class="kpis">
      <div class="card kpi"><div class="label">Média</div><div class="val" id="kml">--</div></div>
      <div class="card kpi"><div class="label">Gasto Total</div><div class="val" id="gasto">R$ 0</div></div>
      <div class="card kpi"><div class="label">Km Atual</div><div class="val" id="kmAtual">0</div></div>
      <div class="card kpi info-card" id="cardAbast"><div class="label">Próx Abastecimento</div><div class="val" id="proxAbast">--</div></div>
    </div>
  </section>

  <!-- ABASTECER -->
  <section id="abastecer" style="display:none">
    <div class="card">
      <h3>⛽ Novo Abastecimento</h3>
      <label class="label">Data</label>
      <input id="aData" type="date">
      <label class="label">Km Odômetro</label>
      <input id="aKm" type="number" placeholder="Ex: 94000">
      <div class="grid grid-2">
        <div><label class="label">Litros</label><input id="aLitros" type="number" step="0.01" placeholder="5.5"></div>
        <div><label class="label">R$ por Litro</label><input id="aValorL" type="number" step="0.001" placeholder="6.29"></div>
      </div>
      <label class="label">Total R$</label>
      <input id="aTotal" type="number" step="0.01" placeholder="34.60" readonly>
      <button class="btn" onclick="addAbast()">Salvar</button>
    </div>
    <div id="listaAbast"></div>
  </section>

  <!-- MANUTENÇÃO -->
  <section id="manutencao" style="display:none">
    <div class="card">
      <h3>🔧 Nova Manutenção</h3>
      <label class="label">Tipo de Serviço</label>
      <input id="mTipo" placeholder="Ex: Troca de óleo, Pastilha">
      <div class="grid grid-2">
        <div><label class="label">Km da troca</label><input id="mKm" type="number" placeholder="94000"></div>
        <div><label class="label">Intervalo km</label><input id="mIntervalo" type="number" placeholder="5000"></div>
      </div>
      <label class="label">Valor R$</label>
      <input id="mValor" type="number" step="0.01" placeholder="120.00">
      <button class="btn" onclick="addManut()">Salvar</button>
    </div>
    <div id="listaManut"></div>
  </section>

  <!-- VEÍCULOS -->
  <section id="veiculos" style="display:none">
    <div class="card">
      <h3>🏍️ Novo Veículo</h3>
      <label class="label">Modelo</label>
      <input id="vNome" placeholder="Ex: Honda Lead 110">
      <div class="grid grid-2">
        <div><label class="label">Ano</label><input id="vAno" type="number" placeholder="2010"></div>
        <div><label class="label">Data Aquisição</label><input id="vData" type="date"></div>
      </div>
      <div class="grid grid-3">
        <div><label class="label">Km compra</label><input id="vKmCompra" type="number" placeholder="93667"></div>
        <div><label class="label">Km/dia</label><input id="vKmDia" type="number" placeholder="30"></div>
        <div><label class="label">Tanque L</label><input id="vTanque" type="number" step="0.1" placeholder="6.5"></div>
      </div>
      <label class="label">Dias que você roda na semana</label>
      <div class="dias-semana" id="diasSemana">
        <button type="button" class="dia-btn" data-dia="1">Seg</button>
        <button type="button" class="dia-btn" data-dia="2">Ter</button>
        <button type="button" class="dia-btn" data-dia="3">Qua</button>
        <button type="button" class="dia-btn" data-dia="4">Qui</button>
        <button type="button" class="dia-btn" data-dia="5">Sex</button>
        <button type="button" class="dia-btn" data-dia="6">Sáb</button>
        <button type="button" class="dia-btn" data-dia="0">Dom</button>
      </div>
      <button class="btn" onclick="addVeiculo()">Salvar Veículo</button>
    </div>
    <div id="listaVeiculos"></div>
  </section>

  <!-- CONFIG -->
  <section id="config" style="display:none">
    <div class="card"><h3>🎨 Aparência</h3><button class="btn-ghost" onclick="toggleTema()">🌓 Trocar Tema</button></div>
    <div class="card"><h3 style="color:var(--danger)">⚠️ Zona de Perigo</h3><button class="btn-danger" onclick="resetApp()">Apagar Tudo</button></div>
  </section>
</div>

<nav class="footer">
  <button onclick="show('painel')" class="active">🏠</button>
  <button onclick="show('abastecer')">⛽</button>
  <button onclick="show('manutencao')">🔧</button>
  <button onclick="show('veiculos')">🏍️</button>
  <button onclick="show('config')">⚙️</button>
</nav>

<!-- Modal Edição -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">Editar</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="saveEdit()">Salvar</button>
    </div>
  </div>
</div>

<script>
const KEY='combApp_v6';
let db={veiculos:[],abastecimentos:[],manutencoes:[],ativo:null};
let edit={tipo:null,id:null};
let diasSelecionados = [1,2,3,4,5]; // Padrão Seg-Sex

function dataHoje(){
  return new Date().toLocaleDateString('en-CA');
}

function formatarData(yyyy_mm_dd){
  if(!yyyy_mm_dd) return '--';
  const [ano, mes, dia] = yyyy_mm_dd.split('-');
  return `${dia}/${mes}/${ano}`;
}

function load(){
  const raw=localStorage.getItem(KEY);
  if(raw) db=JSON.parse(raw);
  if(!db.veiculos.length){
    db.veiculos.push({id:1,nome:'Honda Lead',ano:2010,dataAquisicao:dataHoje(),kmCompra:93667,kmDia:30,kmSemana:150,tanque:6.5,diasSemana:[1,2,3,4,5]});
    db.ativo=1; save();
  }
  vData.value = dataHoje();
  setupDiasSemana();
  renderVeiculosSelect(); renderAll(); loadTema(); aData.value = dataHoje();
}

function save(){localStorage.setItem(KEY,JSON.stringify(db))}

function setupDiasSemana(){
  document.querySelectorAll('.dia-btn').forEach(btn=>{
    const dia = +btn.dataset.dia;
    if(diasSelecionados.includes(dia)) btn.classList.add('active');
    btn.onclick = ()=>{
      btn.classList.toggle('active');
      diasSelecionados = Array.from(document.querySelectorAll('.dia-btn.active')).map(b=>+b.dataset.dia);
    }
  });
}

function show(t){
  ['painel','abastecer','manutencao','veiculos','config'].forEach(s=>document.getElementById(s).style.display='none');
  document.getElementById(t).style.display='block';
  document.querySelectorAll('.footer button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  title.textContent=t.charAt(0).toUpperCase()+t.slice(1);
}

function contarDiasUteis(dataInicio, dataFim, diasSemana){
  let count = 0;
  let data = new Date(dataInicio + 'T00:00:00');
  const fim = new Date(dataFim + 'T00:00:00');
  while(data <= fim){
    if(diasSemana.includes(data.getDay())) count++;
    data.setDate(data.getDate() + 1);
  }
  return count;
}

function getKmAtual(v){
  const abs = db.abastecimentos.filter(a=>a.veiculo==v.id).sort((a,b)=>new Date(b.data+'T00:00:00')-new Date(a.data+'T00:00:00'))[0];
  if(!abs) return v.kmCompra;
  const diasUteis = contarDiasUteis(abs.data, dataHoje(), v.diasSemana || [1,2,3,4,5]);
  return abs.km + (v.kmDia * diasUteis);
}

// VEÍCULOS
function renderVeiculosSelect(){
  selVeiculo.innerHTML=db.veiculos.map(v=>`<option value="${v.id}" ${v.id==db.ativo?'selected':''}>${v.nome}</option>`).join('');
  selVeiculo.onchange=e=>{db.ativo=+e.target.value; save(); renderAll();}
}
function addVeiculo(){
  if(!vNome.value.trim()||!vData.value) return alert('Preencha modelo e data');
  db.veiculos.push({
    id:Date.now(),nome:vNome.value,ano:+vAno.value||0,dataAquisicao:vData.value,
    kmCompra:+vKmCompra.value||0,kmDia:+vKmDia.value||30,kmSemana:(+vKmDia.value||30)*diasSelecionados.length,
    tanque:+vTanque.value||0,diasSemana:[...diasSelecionados]
  });
  db.ativo=db.veiculos.at(-1).id;
  vNome.value=vAno.value=vKmCompra.value=vTanque.value='';
  save(); renderVeiculosSelect(); renderVeiculos(); renderAll();
}
function renderVeiculos(){
  listaVeiculos.innerHTML=db.veiculos.map(v=>{
    const dias = contarDiasUteis(v.dataAquisicao, dataHoje(), v.diasSemana);
    const nomesDias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].filter((d,i)=>v.diasSemana.includes(i)).join(',');
    return `<div class="item">
      <div><b>${v.nome} ${v.ano}</b><br><small>Desde ${formatarData(v.dataAquisicao)} • ${dias} dias úteis<br>${v.kmCompra}km • ${v.kmDia}km/dia • ${nomesDias} • Tanque ${v.tanque||'?'}L</small></div>
      <div class="actions"><button class="btn-ghost" onclick="editVeiculo(${v.id})">✏️</button>${db.veiculos.length>1?`<button class="btn-danger" onclick="delVeiculo(${v.id})">🗑️</button>`:''}</div>
    </div>`;
  }).join('')||'<div class="empty">Nenhum veículo cadastrado</div>';
}
function editVeiculo(id){
  const v=db.veiculos.find(x=>x.id==id); edit={tipo:'veiculo',id};
  diasSelecionados = v.diasSemana || [1,2,3,4,5];

  modalBody.innerHTML=`<label class="label">Modelo</label><input id="eNome" value="${v.nome}"><div class="grid grid-2"><div><label class="label">Ano</label><input id="eAno" type="number" value="${v.ano}"></div><div><label class="label">Data Aquisição</label><input id="eData" type="date" value="${v.dataAquisicao}"></div></div><div class="grid grid-3"><div><label class="label">Km compra</label><input id="eKmCompra" type="number" value="${v.kmCompra}"></div><div><label class="label">Km/dia</label><input id="eKmDia" type="number" value="${v.kmDia}"></div><div><label class="label">Tanque L</label><input id="eTanque" type="number" step="0.1" value="${v.tanque||''}"></div></div><label class="label">Dias que roda</label><div class="dias-semana" id="diasEdit"></div>`;

  modal.classList.add('active');

  setTimeout(()=>{
    const container = document.getElementById('diasEdit');
    ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach((nome,i)=>{
      const btn = document.createElement('button');
      btn.type='button'; btn.className='dia-btn'; btn.dataset.dia=i; btn.textContent=nome;
      if(diasSelecionados.includes(i)) btn.classList.add('active');
      btn.onclick=()=>{btn.classList.toggle('active'); diasSelecionados = Array.from(container.querySelectorAll('.dia-btn.active')).map(b=>+b.dataset.dia)};
      container.appendChild(btn);
    });
  },0);
}
function delVeiculo(id){
  if(!confirm('Apagar veículo e todos os dados?')) return;
  db.veiculos=db.veiculos.filter(v=>v.id!=id);
  db.abastecimentos=db.abastecimentos.filter(a=>a.veiculo!=id);
  db.manutencoes=db.manutencoes.filter(m=>m.veiculo!=id);
  db.ativo=db.veiculos[0].id; save(); renderVeiculosSelect(); renderVeiculos(); renderAll();
}

// ABASTECER
aLitros.oninput=aValorL.oninput=()=>aTotal.value=(aLitros.value*aValorL.value).toFixed(2);
function addAbast(){
  if(!aData.value||!aKm.value||!aLitros.value) return alert('Preencha data, km e litros');
  db.abastecimentos.push({id:Date.now(),veiculo:db.ativo,data:aData.value,km:+aKm.value,litros:+aLitros.value,valor:+aTotal.value,valorL:+aValorL.value});
  aData.value=aKm.value=aLitros.value=aValorL.value=aTotal.value=''; aData.value = dataHoje();
  save(); renderAbast(); renderAll();
}
function renderAbast(){
  const list=db.abastecimentos.filter(a=>a.veiculo==db.ativo).sort((a,b)=>new Date(b.data+'T00:00:00')-new Date(a.data+'T00:00:00'));
  listaAbast.innerHTML=list.map(a=>`
    <div class="item">
      <div>
        <b>${formatarData(a.data)}</b><br>
        <small>${a.km}km • ${a.litros}L • R$${a.valorL.toFixed(3)}/L • Total R$${a.valor.toFixed(2)}</small>
      </div>
      <div class="actions"><button class="btn-ghost" onclick="editAbast(${a.id})">✏️</button><button class="btn-danger" onclick="delAbast(${a.id})">🗑️</button></div>
    </div>
  `).join('')||'<div class="empty">Nenhum abastecimento ainda</div>';
}
function editAbast(id){
  const a=db.abastecimentos.find(x=>x.id==id); edit={tipo:'abast',id};
  modalBody.innerHTML=`<label class="label">Data</label><input id="eData" type="date" value="${a.data}"><label class="label">Km</label><input id="eKm" type="number" value="${a.km}"><div class="grid grid-2"><div><label class="label">Litros</label><input id="eLitros" step="0.01" type="number" value="${a.litros}"></div><div><label class="label">R$/L</label><input id="eValorL" step="0.001" type="number" value="${a.valorL}"></div></div><label class="label">Total</label><input id="eTotal" step="0.01" type="number" value="${a.valor}" readonly>`;
  eLitros.oninput=eValorL.oninput=()=>eTotal.value=(eLitros.value*eValorL.value).toFixed(2);
  modal.classList.add('active');
}
function delAbast(id){if(confirm('Remover?')){db.abastecimentos=db.abastecimentos.filter(a=>a.id!=id); save(); renderAbast(); renderAll();}}

// MANUTENÇÃO
function addManut(){
  const tipo = mTipo.value.trim();
  const km = +mKm.value;
  const intervalo = +mIntervalo.value;
  if(!tipo ||!km ||!intervalo) return alert('Preencha tipo, km e intervalo');
  db.manutencoes.push({id:Date.now(),veiculo:db.ativo,tipo,km,intervalo,proxKm:km+intervalo,valor:+mValor.value||0});
  mTipo.value=mKm.value=mIntervalo.value=mValor.value='';
  save(); renderManut(); renderAll();
}
function renderManut(){
  const v=db.veiculos.find(x=>x.id==db.ativo);
  const kmAtual=getKmAtual(v);
  const list=db.manutencoes.filter(m=>m.veiculo==db.ativo).sort((a,b)=>a.proxKm-b.proxKm);
  listaManut.innerHTML=list.map(m=>{
    const faltam=m.proxKm-kmAtual;
    const diasUteis=Math.ceil(faltam/v.kmDia);
    let cls='',badge='';
    if(faltam<=0){cls='urgent'; badge='<span class="badge danger">VENCIDA</span>'}
    else if(faltam<=500){cls='alert'; badge='<span class="badge warn">ATENÇÃO</span>'}
    return `<div class="item ${cls}"><div><b>${m.tipo}</b> ${badge}<br><small>Feito em ${m.km}km • Próxima em ${m.proxKm}km<br>Faltam ${faltam}km ~ ${diasUteis} dias úteis</small></div><div class="actions"><button class="btn-ghost" onclick="editManut(${m.id})">✏️</button><button class="btn-danger" onclick="delManut(${m.id})">🗑️</button></div></div>`;
  }).join('')||'<div class="empty">Nenhuma manutenção cadastrada</div>';
}
function editManut(id){
  const m=db.manutencoes.find(x=>x.id==id); edit={tipo:'manut',id};
  modalBody.innerHTML=`<label class="label">Tipo</label><input id="eTipo" value="${m.tipo}"><div class="grid grid-2"><div><label class="label">Km</label><input id="eKm" type="number" value="${m.km}"></div><div><label class="label">Intervalo</label><input id="eIntervalo" type="number" value="${m.intervalo}"></div></div><label class="label">Valor</label><input id="eValor" type="number" value="${m.valor}">`;
  modal.classList.add('active');
}
function delManut(id){if(confirm('Remover?')){db.manutencoes=db.manutencoes.filter(m=>m.id!=id); save(); renderManut(); renderAll();}}

// MODAL
function closeModal(){modal.classList.remove('active'); edit={tipo:null,id:null}}
function saveEdit(){
  if(edit.tipo=='veiculo'){
    const v=db.veiculos.find(x=>x.id==edit.id);
    Object.assign(v,{nome:eNome.value,ano:+eAno.value,dataAquisicao:eData.value,kmCompra:+eKmCompra.value,kmDia:+eKmDia.value,kmSemana:+eKmDia.value*diasSelecionados.length,tanque:+eTanque.value||0,diasSemana:[...diasSelecionados]});
  }
  if(edit.tipo=='abast'){
    const a=db.abastecimentos.find(x=>x.id==edit.id);
    Object.assign(a,{data:eData.value,km:+eKm.value,litros:+eLitros.value,valor:+eTotal.value,valorL:+eValorL.value});
  }
  if(edit.tipo=='manut'){
    const m=db.manutencoes.find(x=>x.id==edit.id);
    const novoKm = +eKm.value;
    const novoIntervalo = +eIntervalo.value;
    Object.assign(m,{tipo:eTipo.value,km:novoKm,intervalo:novoIntervalo,proxKm:novoKm+novoIntervalo,valor:+eValor.value});
  }
  save(); closeModal(); renderAll();
  if(edit.tipo=='veiculo') renderVeiculos();
  if(edit.tipo=='abast') renderAbast();
  if(edit.tipo=='manut') renderManut();
}

// PAINEL
function renderAll(){
  const v=db.veiculos.find(x=>x.id==db.ativo);
  const abs=db.abastecimentos.filter(a=>a.veiculo==db.ativo).sort((a,b)=>new Date(a.data+'T00:00:00')-new Date(b.data+'T00:00:00'));

  const kmAtual=getKmAtual(v);
  document.getElementById('kmAtual').textContent=kmAtual+' km';
  document.getElementById('gasto').textContent='R$ '+abs.reduce((s,a)=>s+a.valor,0).toFixed(2);

  let kml=0;
  if(abs.length>1){
    let km=0,litros=0;
    for(let i=1;i<abs.length;i++){km+=abs[i].km-abs[i-1].km; litros+=abs[i].litros}
    kml=km/litros;
    document.getElementById('kml').textContent=kml.toFixed(1)+' km/l';
  } else {
    document.getElementById('kml').textContent='--';
  }

  if(kml>0 && abs.length>0){
    const ultimoAbs = abs.at(-1);
    const litrosTanque = v.tanque || Math.max(...abs.map(a=>a.litros));
    const autonomia = Math.floor(kml * litrosTanque);
    const proxKm = ultimoAbs.km + autonomia;
    const faltam = proxKm - kmAtual;
    const diasUteis = Math.ceil(faltam/v.kmDia);

    let cls = '';
    if(faltam<=0) cls='urgent';
    else if(faltam<=50) cls='alert';

    cardAbast.className = 'card kpi info-card ' + cls;
    proxAbast.innerHTML = faltam<=0? 'ABASTECER AGORA' : proxKm+'km<br><small>~'+diasUteis+' dias úteis</small>';
  } else {
    proxAbast.textContent = 'Cadastre tanque';
  }

  renderVeiculos(); renderAbast(); renderManut();
}

// TEMA + RESET
function loadTema(){if(localStorage.getItem('tema')=='light') document.body.classList.add('light')}
function toggleTema(){document.body.classList.toggle('light'); localStorage.setItem('tema',document.body.classList.contains('light')?'light':'dark')}
function resetApp(){
  if(confirm('Apagar tudo?')&&confirm('Tem certeza?')){localStorage.clear(); location.reload()}
}

load();
</script>
