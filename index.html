<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Controle de Combustível</title>

  <style>
    :root{
      --bg:#06101f;
      --panel:rgba(255,255,255,.04);
      --card:rgba(255,255,255,.06);
      --stroke:rgba(255,255,255,.10);
      --text:#eaf1ff;
      --muted:rgba(234,241,255,.70);
      --accent:#2b6dff;
      --accent2:#1f55cc;
      --danger:#ff476f;
      --ok:#29d17c;
      --shadow:0 14px 34px rgba(0,0,0,.28);
      --radius:18px;
      --line:rgba(255,255,255,.08);
      --sideW: 280px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: radial-gradient(1200px 900px at 10% 0%, #0a1c38 0%, var(--bg) 45%, #050c17 100%);
      overflow-x:hidden;
    }
    .app{
      min-height:100vh;
      display:flex;
    }

    /* Sidebar */
    .sidebar{
      width:var(--sideW);
      background:rgba(5,12,23,.86);
      border-right:1px solid var(--line);
      padding:14px 12px;
      position:fixed;
      top:0; bottom:0; left:0;
      transform: translateX(-102%);
      transition: transform .22s ease;
      z-index:2500;
      backdrop-filter: blur(14px);
    }
    .sidebar.open{ transform: translateX(0); }
    .sidebar .brand{
      display:flex; align-items:center; gap:10px;
      padding:10px 10px 14px;
      border-bottom:1px solid var(--line);
      margin-bottom:10px;
    }
    .brand .logo{font-size:22px}
    .brand .txt{display:flex; flex-direction:column}
    .brand .txt .t{font-size:14px; font-weight:900}
    .brand .txt .s{font-size:12px; color:var(--muted); font-weight:800}

    .nav{
      display:flex;
      flex-direction:column;
      gap:8px;
      padding:10px 6px;
    }
    .nav button{
      width:100%;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--muted);
      padding:12px 12px;
      cursor:pointer;
      font-weight:900;
      font-size:13px;
      text-align:left;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .nav button.active{
      background:rgba(43,109,255,.16);
      border-color:rgba(43,109,255,.35);
      color:var(--text);
    }
    .nav .ic{width:22px; display:inline-flex; justify-content:center}

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      backdrop-filter: blur(6px);
      display:none;
      z-index:2400;
    }
    .overlay.show{display:block}

    /* Main */
    .main{
      width:100%;
      padding:16px 14px 28px;
      margin-left:0;
    }
    @media (min-width: 980px){
      .sidebar{ transform: translateX(0); position:sticky; z-index:1; }
      .overlay{display:none !important;}
      .main{ margin-left:0; padding-left:18px; }
      .topbar .menuBtn{ display:none; }
      .app{ gap:0; }
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }
    .menuBtn{
      width:auto;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.05);
      color:var(--text);
      padding:10px 12px;
      cursor:pointer;
      font-weight:900;
    }
    .statusPill{
      display:flex;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--muted);
      font-weight:900;
      font-size:12px;
      white-space:nowrap;
    }
    .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(41,209,124,.18)}
    h1{
      margin:0;
      font-size:24px;
      font-weight:950;
      letter-spacing:.2px;
    }
    .subtitle{
      margin:6px 0 0;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
    }

    /* Sections */
    .section{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
      margin:14px 0;
    }
    .sectionTitle{
      margin:0 0 10px;
      font-size:14px;
      font-weight:950;
    }

    /* Cards */
    .cards{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    @media (min-width: 980px){
      .cards{ grid-template-columns:repeat(4, 1fr); }
    }
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.04));
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px 14px;
      min-height:92px;
    }
    .card .label{
      margin:0;
      color:var(--muted);
      font-size:12px;
      font-weight:850;
    }
    .card .val{
      margin-top:10px;
      font-size:22px;
      font-weight:950;
    }
    .small{
      margin-top:6px;
      color:rgba(234,241,255,.55);
      font-size:12px;
      font-weight:800;
    }

    /* Form */
    label{
      display:block;
      margin:10px 0 6px;
      color:rgba(234,241,255,.78);
      font-size:12px;
      font-weight:900;
    }
    input, button{
      width:100%;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      color:var(--text);
      padding:12px 12px;
      outline:none;
      font-weight:900;
      font-size:14px;
    }
    input::placeholder{ color:rgba(234,241,255,.45); font-weight:800; }
    input:focus{ border-color:rgba(43,109,255,.55); box-shadow:0 0 0 4px rgba(43,109,255,.12); }

    .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width: 420px){ .row{ grid-template-columns:1fr; } }

    .btn{
      background:linear-gradient(180deg, var(--accent), var(--accent2));
      border:1px solid rgba(255,255,255,.14);
      cursor:pointer;
      font-weight:950;
    }
    .btn.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      color:var(--text);
    }
    .btn.danger{
      background:rgba(255,71,111,.12);
      border-color:rgba(255,71,111,.30);
      color:#ffd7e0;
    }
    .btn:active{ transform: translateY(1px); }

    .hint{ color:var(--muted); font-size:12px; font-weight:800; margin:0 0 10px; }
    .statusLine{ color:rgba(234,241,255,.78); font-size:12px; font-weight:900; margin-top:10px; }

    /* Table */
    table{
      width:100%;
      border-collapse:collapse;
      overflow:hidden;
      border-radius:16px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
    }
    th, td{
      padding:10px 10px;
      text-align:left;
      font-size:12px;
      border-bottom:1px solid rgba(255,255,255,.07);
      vertical-align:top;
      font-weight:800;
    }
    th{ color:rgba(234,241,255,.70); font-weight:900; }
    tr:last-child td{ border-bottom:none; }

    /* Toast */
    #toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      background:rgba(0,0,0,.76);
      color:#fff;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      font-weight:900;
      font-size:12px;
      display:none;
      z-index:4000;
      max-width:92vw;
      text-align:center;
    }
  </style>
</head>

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">🚗</div>
      <div class="txt">
        <div class="t">Painel Combustível</div>
        <div class="s">Foco total no simples</div>
      </div>
    </div>

    <nav class="nav" aria-label="Menu">
      <button class="active" data-view="painel"><span class="ic">🏠</span><span>Painel</span></button>
      <button data-view="abastecer"><span class="ic">⛽</span><span>Abastecer</span></button>
      <button data-view="historico"><span class="ic">🧾</span><span>Histórico</span></button>
    </nav>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">
    <div class="topbar">
      <button class="menuBtn" id="menuBtn">☰ Menu</button>
      <div>
        <h1 id="pageTitle">Painel</h1>
        <div class="subtitle" id="pageSub">Métricas essenciais</div>
      </div>
      <div class="statusPill"><span class="dot"></span><span id="pillStatus">Pronto</span></div>
    </div>

    <section class="section view" id="view-painel">
      <div class="cards">
        <div class="card">
          <div class="label">Média Geral</div>
          <div class="val" id="kmlGeral">—</div>
          <div class="small">Km/L total</div>
        </div>
        <div class="card">
          <div class="label">Litros Abastecidos</div>
          <div class="val" id="totalLitros">0 L</div>
          <div class="small">volume acumulado</div>
        </div>
        <div class="card">
          <div class="label">Dias Rodados</div>
          <div class="val" id="diasRodados">0</div>
          <div class="small">período ativo</div>
        </div>
        <div class="card">
          <div class="label">Km Rodados</div>
          <div class="val" id="totalKm">0 km</div>
          <div class="small">distância total</div>
        </div>
      </div>
    </section>

    <section class="section view" id="view-abastecer" style="display:none">
      <div class="sectionTitle">⛽ Novo lançamento</div>
      
      <label for="data">Data</label>
      <input id="data" type="date" />

      <div class="row">
        <div>
          <label for="odometro">Odômetro (km)</label>
          <input id="odometro" inputmode="numeric" placeholder="Ex: 84092" />
        </div>
        <div>
          <label for="litros">Litros</label>
          <input id="litros" inputmode="decimal" placeholder="Ex: 35,5" />
        </div>
      </div>

      <div class="row" style="margin-top:16px">
        <button class="btn" id="btnSalvar" type="button">Salvar</button>
        <button class="btn secondary" id="btnLimparForm" type="button">Limpar</button>
      </div>

      <div class="row" style="margin-top:12px">
        <button class="btn danger" id="btnApagarTudo" type="button">🧹 Apagar tudo</button>
        <button class="btn secondary" id="btnExportarJson" type="button">⬇️ Backup (JSON)</button>
      </div>

      <div class="statusLine" id="saveStatus">—</div>
    </section>

    <section class="section view" id="view-historico" style="display:none">
      <div class="sectionTitle">🧾 Histórico de Consumo</div>

      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Odômetro</th>
              <th>Litros</th>
              <th>Km Rodados (Δ)</th>
              <th>Rendimento</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="statusLine" id="histStatus">—</div>
    </section>
  </main>
</div>

<div id="toast"></div>

<script>
const STORE_KEY = "cb_abastecimentos_v4";
const $ = (id)=>document.getElementById(id);

function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.style.display="block";
  clearTimeout(toast._tm);
  toast._tm = setTimeout(()=>{ t.style.display="none"; }, 2500);
}
function setPill(msg){ $("pillStatus").textContent = msg; }

function parseBRNumber(s){
  if(!s) return null;
  const norm = String(s).trim().replace(/\./g,"").replace(",", ".");
  const n = Number(norm);
  return Number.isFinite(n) ? n : null;
}
function formatNum(n, digits=2){
  const v = Number(n);
  return Number.isFinite(v) ? v.toLocaleString("pt-BR",{minimumFractionDigits:digits, maximumFractionDigits:digits}) : "—";
}

function loadItems(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); }
  catch(e){ return []; }
}
function saveItems(items){ localStorage.setItem(STORE_KEY, JSON.stringify(items)); }

let items = loadItems();

/* Views / Menu */
const views = ["painel","abastecer","historico"];
function showView(name){
  for(const v of views){
    const el = document.getElementById("view-"+v);
    if(el) el.style.display = (v===name) ? "block" : "none";
  }
  document.querySelectorAll(".nav button").forEach(b=>{
    b.classList.toggle("active", b.dataset.view===name);
  });
  
  const titles = {
    painel: ["Painel","Métricas essenciais"],
    abastecer: ["Abastecer","Novo lançamento"],
    historico: ["Histórico","Seus lançamentos"]
  };
  $("pageTitle").textContent = titles[name][0];
  $("pageSub").textContent = titles[name][1];
  closeSidebar();
}
function openSidebar(){ $("sidebar").classList.add("open"); $("overlay").classList.add("show"); }
function closeSidebar(){ $("sidebar").classList.remove("open"); $("overlay").classList.remove("show"); }

$("menuBtn").addEventListener("click", openSidebar);
$("overlay").addEventListener("click", closeSidebar);
document.querySelectorAll(".nav button").forEach(b=>{
  b.addEventListener("click", ()=>showView(b.dataset.view));
});

/* Cálculo das Métricas Principais */
function sortItems(){
  items.sort((a,b)=> (a.data||"").localeCompare(b.data||"") || (Number(a.odometro)-Number(b.odometro)));
}

function processMetrics(){
  sortItems();
  let totalLitros = 0;
  
  for(let i=0; i<items.length; i++){
    totalLitros += Number(items[i].litros) || 0;
    
    if(i > 0){
      const delta = Number(items[i].odometro) - Number(items[i-1].odometro);
      items[i].deltaKm = delta > 0 ? delta : null;
      items[i].kml = (delta > 0 && Number(items[i].litros) > 0) ? (delta / Number(items[i].litros)) : null;
    } else {
      items[i].deltaKm = null;
      items[i].kml = null;
    }
  }
}

function renderAll(){
  processMetrics();
  renderCards();
  renderTable();
}

function renderCards(){
  if(items.length < 2){
    $("kmlGeral").textContent = "—";
    $("totalLitros").textContent = items.length === 1 ? `${formatNum(items[0].litros, 2)} L` : "0 L";
    $("diasRodados").textContent = "0";
    $("totalKm").textContent = "0 km";
    return;
  }

  const primeirOdo = Number(items[0].odometro);
  const ultimoOdo = Number(items[items.length-1].odometro);
  const deltaTotalKm = ultimoOdo - primeirOdo;

  // Litros gastos a partir do primeiro abastecimento cheio para bater com os Km rodados
  let litrosConsiderados = 0;
  let litrosTotaisAbs = 0;
  for(let i=0; i<items.length; i++){
    litrosTotaisAbs += Number(items[i].litros) || 0;
    if(i > 0) litrosConsiderados += Number(items[i].litros) || 0;
  }

  const mediaGeral = (deltaTotalKm > 0 && litrosConsiderados > 0) ? (deltaTotalKm / litrosConsiderados) : null;

  // Dias rodados
  const dataIni = new Date(items[0].data);
  const dataFim = new Date(items[items.length-1].data);
  const diffTime = Math.abs(dataFim - dataIni);
  const diffDias = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

  $("kmlGeral").textContent = mediaGeral ? `${formatNum(mediaGeral, 2)}` : "—";
  $("totalLitros").textContent = `${formatNum(litrosTotaisAbs, 2)} L`;
  $("diasRodados").textContent = items.length > 1 ? diffDias : "0";
  $("totalKm").textContent = deltaTotalKm > 0 ? `${deltaTotalKm.toLocaleString("pt-BR")} km` : "0 km";
}

function renderTable(){
  const tb = $("tbody");
  tb.innerHTML = "";
  
  if(items.length===0){
    $("histStatus").textContent = "Nenhum registro encontrado.";
    return;
  }

  const displayRows = [...items].reverse();
  for(const x of displayRows){
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${x.data.split("-").reverse().join("/")}</td>
      <td>${Number(x.odometro).toLocaleString("pt-BR")} km</td>
      <td>${formatNum(x.litros, 3)} L</td>
      <td>${x.deltaKm ? `${x.deltaKm.toLocaleString("pt-BR")} km` : "—"}</td>
      <td>${x.kml ? `${formatNum(x.kml, 2)} Km/L` : "—"}</td>
    `;
    tb.appendChild(tr);
  }
  $("histStatus").textContent = `${items.length} lançamento(s).`;
}

/* Ações */
$("btnSalvar").addEventListener("click", ()=>{
  const data = $("data").value;
  const odometro = parseBRNumber($("odometro").value);
  const litros = parseBRNumber($("litros").value);

  if(!data){ toast("Selecione a data."); return; }
  if(!odometro || odometro <= 0){ toast("Odômetro inválido."); return; }
  if(!litros || litros <= 0){ toast("Volume de litros inválido."); return; }

  const item = {
    id: `${Date.now()}`,
    data, odometro, litros
  };

  items.push(item);
  saveItems(items);
  renderAll();

  $("odometro").value = "";
  $("litros").value = "";
  $("saveStatus").textContent = "Salvo com sucesso! ✅";
  toast("Salvo ✅");
  showView("painel");
});

$("btnLimparForm").addEventListener("click", ()=>{
  $("odometro").value = "";
  $("litros").value = "";
  toast("Campos limpos");
});

$("btnApagarTudo").addEventListener("click", ()=>{
  if(!confirm("Tem certeza que deseja apagar todo o histórico?")) return;
  items = [];
  saveItems(items);
  renderAll();
