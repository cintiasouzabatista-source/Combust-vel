<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Moto Control Pro</title>
<style>
:root{
  --bg:#0b0f19;--panel:#131a26;--card:#1c2533;--text:#eaf1ff;
  --muted:rgba(234,241,255,.65);--accent:#2b6dff;--accent2:#10b981;
  --line:rgba(255,255,255,.08);--radius:18px;--danger:#ef4444;
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(1200px 800px at 20% -10%,#1a2333 0%,transparent 60%),var(--bg);min-height:100vh}
.app{max-width:680px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:22px;margin:0 0 12px}
select,input,button{font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px}
select{width:100%;margin-bottom:16px}
input{width:100%;margin-bottom:10px}
button{cursor:pointer;font-weight:600;transition:.2s}
.btn{width:100%;background:var(--accent);border:none}
.btn:active{transform:scale(.98)}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;transition:.2s}
.card:hover{border-color:rgba(43,109,255,.3)}
.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.val{font-size:24px;font-weight:700;margin-top:6px}
.view{display:none;animation:fade.25s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.item small{color:var(--muted)}
.badge{padding:4px 8px;border-radius:8px;background:rgba(16,185,129,.15);color:var(--accent2);font-size:11px;font-weight:700}
.footer-clean{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:28px;padding:14px 26px;background:rgba(19,26,38,.9);border:1px solid var(--line);border-radius:30px;z-index:999;backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.footer-clean button{border:none;background:none;color:var(--muted);font-size:22px;cursor:pointer;transition:.2s}
.footer-clean button.active{color:var(--accent);transform:translateY(-3px)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{color:var(--muted);text-align:center;padding:40px 20px}
.row{display:flex;gap:8px}
.row button{flex:0 0 auto}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="pageTitle">Painel</h1>
    <div class="row">
      <select id="globalVehicle"></select>
      <button class="btn-ghost" onclick="addVehicle()">+ Veículo</button>
    </div>
  </header>

  <main>
    <!-- PAINEL -->
    <section class="view active" id="view-painel">
      <div class="cards">
        <div class="card"><div class="label">Média Geral</div><div class="val" id="kmlGeral">--</div></div>
        <div class="card"><div class="label">Últimos 3</div><div class="val" id="kmlRecente">--</div></div>
        <div class="card"><div class="label">Próx. Abast. Est.</div><div class="val" id="proxAbast">--</div></div>
        <div class="card"><div class="label">Total Gasto</div><div class="val" id="totalGasto">R$ 0</div></div>
        <div class="card"><div class="label">Km Atual</div><div class="val" id="kmAtual">0 km</div></div>
        <div class="card"><div class="label">Qtd Abastecimentos</div><div class="val" id="qtdAbast">0</div></div>
      </div>
    </section>

    <!-- ABASTECER -->
    <section class="view" id="view-abastecer">
      <div class="card">
        <div class="label">Novo Abastecimento</div>
        <input type="date" id="dataAbast">
        <div class="grid-2">
          <input type="number" id="kmAbast" placeholder="Km atual">
          <input type="number" step="0.01" id="litrosAbast" placeholder="Litros">
        </div>
        <div class="grid-2">
          <input type="number" step="0.01" id="valorAbast" placeholder="Valor total R$">
          <select id="tipoComb">
            <option>Gasolina</option>
            <option>Etanol</option>
            <option>Gasolina Aditivada</option>
          </select>
        </div>
        <button class="btn" onclick="salvarAbastecimento()">Salvar</button>
      </div>
    </section>

    <!-- HISTÓRICO -->
    <section class="view" id="view-historico">
      <div class="list" id="listaHistorico">
        <div class="empty">Nenhum abastecimento registrado</div>
      </div>
    </section>

    <!-- MANUTENÇÃO -->
    <section class="view" id="view-manutencao">
      <div class="card">
        <div class="label">Adicionar Manutenção</div>
        <input type="text" id="descManut" placeholder="Ex: Troca de óleo">
        <div class="grid-2">
          <input type="number" id="kmManut" placeholder="Km da troca">
          <input type="number" id="proxKmManut" placeholder="Próx. troca em km">
        </div>
        <button class="btn" onclick="salvarManutencao()">Salvar</button>
      </div>
      <div class="list" id="listaManut" style="margin-top:12px"></div>
    </section>
  </main>

  <nav class="footer-clean">
    <button data-view="painel" class="active">🏠</button>
    <button data-view="abastecer">⛽</button>
    <button data-view="historico">🧾</button>
    <button data-view="manutencao">🔧</button>
  </nav>
</div>

<script>
const STORAGE_KEY = 'motoControl_v2';
let db = {veiculos:[], abastecimentos:[], manutencoes:[], ativo:null};
let activeVehicle = null;
let items = [];

function load(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw) db = JSON.parse(raw);
  if(!db.veiculos.length){
    db.veiculos = [{id:'v1', nome:'Moto'}];
    db.ativo = 'v1';
  }
  activeVehicle = db.ativo;
  items = db.abastecimentos;
  renderVehicles();
  renderAll();
}

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }

function renderVehicles(){
  const sel = document.getElementById('globalVehicle');
  sel.innerHTML = db.veiculos.map(v=>`<option value="${v.id}" ${v.id===activeVehicle?'selected':''}>${v.nome}</option>`).join('');
  sel.onchange = e => { activeVehicle = e.target.value; db.ativo = activeVehicle; save(); renderAll(); }
}

function addVehicle(){
  const nome = prompt('Nome do veículo:');
  if(!nome) return;
  const id = 'v'+Date.now();
  db.veiculos.push({id,nome});
  activeVehicle = id; db.ativo = id;
  save(); renderVehicles(); renderAll();
}

function fmtBRL(v){ return 'R$ '+v.toFixed(2).replace('.',',') }

function calcularKmL(lista){
  if(lista.length < 2) return null;
  const sorted = [...lista].sort((a,b)=>a.odometro-b.odometro);
  let totalKm=0, totalLitros=0;
  for(let i=1;i<sorted.length;i++){
    const km = sorted[i].odometro - sorted[i-1].odometro;
    if(km>0 && sorted[i].litros>0){
      totalKm += km;
      totalLitros += sorted[i].litros;
    }
  }
  return totalLitros>0? totalKm/totalLitros : null;
}

function calcularProximoAbastecimento(lista){
  if(lista.length < 2) return '--';
  const sorted = [...lista].sort((a,b)=>new Date(a.data)-new Date(b.data));
  const ultimo = sorted[sorted.length-1];
  const penultimo = sorted[sorted.length-2];
  const dias = Math.max(1, (new Date(ultimo.data) - new Date(penultimo.data))/(1000*60*60*24));
  const kmRodados = ultimo.odometro - penultimo.odometro;
  const kmPorDia = kmRodados/dias;
  const kmL = calcularKmL(lista) || 30; // fallback 30km/l
  const autonomia = 6 * kmL; // tanque 6L padrão
  const diasRest = Math.round(autonomia/Math.max(0.1,kmPorDia));
  return diasRest+' dias';
}

function renderAll(){
  const filtro = db.abastecimentos.filter(x=>x.veiculo===activeVehicle).sort((a,b)=>new Date(b.data)-new Date(a.data));
  const manut = db.manutencoes.filter(x=>x.veiculo===activeVehicle).sort((a,b)=>b.km-a.km);

  // Painel
  const kml = calcularKmL(filtro);
  const kmlRec = calcularKmL(filtro.slice(0,4));
  document.getElementById('kmlGeral').textContent = kml? kml.toFixed(1)+' km/l' : '--';
  document.getElementById('kmlRecente').textContent = kmlRec? kmlRec.toFixed(1)+' km/l' : '--';
  document.getElementById('proxAbast').textContent = calcularProximoAbastecimento(filtro);
  document.getElementById('totalGasto').textContent = fmtBRL(filtro.reduce((s,x)=>s+(x.valor||0),0));
  document.getElementById('kmAtual').textContent = filtro[0]?.odometro? filtro[0].odometro+' km' : '0 km';
  document.getElementById('qtdAbast').textContent = filtro.length;

  // Histórico
  const histEl = document.getElementById('listaHistorico');
  histEl.innerHTML = filtro.length? filtro.map(a=>`
    <div class="item">
      <div>
        <div>${new Date(a.data).toLocaleDateString('pt-BR')} <span class="badge">${a.combustivel}</span></div>
        <small>${a.odometro} km • ${a.litros}L • ${fmtBRL(a.valor)}</small>
      </div>
      <button class="btn-ghost" onclick="removerAbast('${a.id}')">🗑️</button>
    </div>
  `).join('') : '<div class="empty">Nenhum abastecimento registrado</div>';

  // Manutenção
  const manutEl = document.getElementById('listaManut');
  manutEl.innerHTML = manut.length? manut.map(m=>`
    <div class="item">
      <div>
        <div>${m.descricao}</div>
        <small>Troca: ${m.km} km • Próxima: ${m.proxKm} km</small>
      </div>
      <button class="btn-ghost" onclick="removerManut('${m.id}')">🗑️</button>
    </div>
  `).join('') : '<div class="empty">Nenhuma manutenção registrada</div>';

  document.getElementById('dataAbast').valueAsDate = new Date();
}

function salvarAbastecimento(){
  const data = document.getElementById('dataAbast').value;
  const km = +document.getElementById('kmAbast').value;
  const litros = +document.getElementById('litrosAbast').value;
  const valor = +document.getElementById('valorAbast').value;
  const combustivel = document.getElementById('tipoComb').value;
  if(!data||!km||!litros||!valor) return alert('Preencha todos os campos');

  db.abastecimentos.push({id:Date.now(),veiculo:activeVehicle,data,odometro:km,litros,valor,combustivel});
  save();
  ['kmAbast','litrosAbast','valorAbast'].forEach(id=>document.getElementById(id).value='');
  renderAll();
  document.querySelector('[data-view="painel"]').click();
}

function removerAbast(id){
  if(confirm('Remover este abastecimento?')){
    db.abastecimentos = db.abastecimentos.filter(x=>x.id!=id);
    save(); renderAll();
  }
}

function salvarManutencao(){
  const desc = document.getElementById('descManut').value;
  const km = +document.getElementById('kmManut').value;
  const proxKm = +document.getElementById('proxKmManut').value;
  if(!desc||!km||!proxKm) return alert('Preencha todos os campos');
  db.manutencoes.push({id:Date.now(),veiculo:activeVehicle,descricao:desc,km,proxKm});
  save();
  ['descManut','kmManut','proxKmManut'].forEach(id=>document.getElementById(id).value='');
  renderAll();
}

function removerManut(id){
  db.manutencoes = db.manutencoes.filter(x=>x.id!=id);
  save(); renderAll();
}

// Navegação footer
document.querySelectorAll('.footer-clean button').forEach(btn=>{
  btn.onclick = () => {
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
    document.querySelectorAll('.footer-clean button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('pageTitle').textContent =
      btn.dataset.view==='painel'?'Painel':
      btn.dataset.view==='abastecer'?'Abastecer':
      btn.dataset.view==='historico'?'Histórico':'Manutenção';
  }
});

load();
</script>
</body>
</html>
