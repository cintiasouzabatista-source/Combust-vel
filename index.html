<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Combustível App</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;--line:#334155}
html.light{--bg:#f8fafc;--card:#ffffff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{margin:0;background:var(--bg);color:var(--text);transition:.2s;touch-action:pan-y}
.wrap{max-width:680px;margin:0 auto;padding:16px 12px 100px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
header h1{flex:1;font-size:20px;margin:0;font-weight:700}
select,input,button{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15px}
.btn{background:var(--accent);color:#fff;font-weight:700;border:none}
.btn-ghost{background:transparent;border:1px solid var(--line);font-weight:700}
.btn-danger{background:var(--danger);color:#fff;font-weight:700}
.btn-sm{padding:8px 12px;font-size:14px;width:auto;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:16px;text-align:center}
.label{font-size:12px;color:var(--muted);margin-bottom:6px;display:block;text-transform:uppercase}
.val{font-size:26px;font-weight:800;margin-top:6px}
.item{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.footer{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:12px;padding:12px 20px;background:var(--card);border:1px solid var(--line);border-radius:24px;z-index:10}
.footer button{border:none;background:none;font-size:24px;color:var(--muted)}
.footer button.active{color:var(--accent)}
.inline-edit{display:none;margin-top:10px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.inline-edit.active{display:block}
.chart-container{position:relative;height:240px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap" id="appContainer">
  <header>
    <h1 id="tituloPagina">Painel</h1>
    <button id="btnTema" class="btn-ghost btn-sm" onclick="toggleTema()" style="width: auto; margin-right: 8px;">🌓</button>
    <select id="selVeiculo"></select>
  </header>

  <section id="painel">
    <div class="kpis">
      <div class="card kpi"><div class="label">Média</div><div class="val" id="kml">--</div></div>
      <div class="card kpi"><div class="label">Gasto Total</div><div class="val" id="gasto">R$ 0</div></div>
      <div class="card kpi"><div class="label">Km Atual</div><div class="val" id="kmAtual">0</div></div>
      <div class="card kpi" id="cardAbast"><div class="label">Próx Abastecimento</div><div class="val" id="proxAbast">--</div></div>
    </div>
    <div class="card">
      <h3>📊 Consumo km/l</h3>
      <div class="chart-container"><canvas id="graficoConsumo"></canvas></div>
    </div>
  </section>

  <section id="abastecer" style="display:none">
    <div class="card">
      <h3>⛽ Novo Abastecimento</h3>
      <label class="label">Data</label><input id="aData" type="date">
      <label class="label">Km</label><input id="aKm" type="number">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label class="label">Litros</label><input id="aLitros" type="number" step="0.01"></div>
        <div><label class="label">R$/L</label><input id="aValorL" type="number" step="0.001"></div>
      </div>
      <label class="label">Total</label><input id="aTotal" type="number" readonly>
      <button class="btn" onclick="addAbast()">Salvar</button>
    </div>
    <div id="listaAbast"></div>
  </section>

  <section id="veiculos" style="display:none">
    <div class="card">
      <h3>🏍️ Novo Veículo</h3>
      <label class="label">Modelo</label><input id="vNome" placeholder="Honda Lead">
      <button class="btn" onclick="addVeiculo()">Salvar</button>
    </div>
    <div id="listaVeiculos"></div>
  </section>
</div>

<nav class="footer">
  <button onclick="show('painel')" class="active">🛣️</button>
  <button onclick="show('abastecer')">⛽</button>
  <button onclick="show('veiculos')">🏍️</button>
</nav>

<script>
const KEY_ATUAL = 'combApp_final'; // NUNCA MUDA ISSO
const KEYS_ANTIGAS=['combApp_v7','combApp_v6','combApp_v5','combApp_v4','combApp_v3','combApp_v2','combApp'];
let db={veiculos:[],abastecimentos:[],ativo:null,tema:'dark'};
let abaAtual = 'painel';
let grafico = null;
const $ = id => document.getElementById(id);

function dataHoje(){return new Date().toISOString().split('T')[0];}

function load(){
  let raw = localStorage.getItem(KEY_ATUAL);
  if(!raw){
    for(let k of KEYS_ANTIGAS){
      raw = localStorage.getItem(k);
      if(raw){localStorage.setItem(KEY_ATUAL, raw); localStorage.removeItem(k); break;}
    }
  }
  if(raw) db = JSON.parse(raw);
  if($('aData')) $('aData').value = dataHoje();
  renderVeiculosSelect();
  applyTheme();
  renderAll();
  setTimeout(setupSwipe, 100);
}

function applyTheme(){if(db.tema==='light') document.documentElement.classList.add('light'); else document.documentElement.classList.remove('light');}
function toggleTema(){db.tema = db.tema === 'dark'? 'light' : 'dark'; save(); applyTheme(); if(abaAtual == 'painel') renderGrafico();}
function save(){localStorage.setItem(KEY_ATUAL, JSON.stringify(db));}

function show(t){
  abaAtual = t;
  ['painel','abastecer','veiculos'].forEach(s => $(s).style.display = 'none');
  $(t).style.display = 'block';
  document.querySelectorAll('.footer button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.footer button')[['painel','abastecer','veiculos'].indexOf(t)].classList.add('active');
  $('tituloPagina').textContent = t.charAt(0).toUpperCase() + t.slice(1);
  if(t == 'painel') setTimeout(renderGrafico, 200);
}

function setupSwipe(){
  const container = $('appContainer');
  if(!container) return;
  container.ontouchstart = container.ontouchend = null;
  let startX = 0;
  container.ontouchstart = e => {startX = e.touches[0].clientX;};
  container.ontouchend = e => {
    const diffX = e.changedTouches[0].clientX - startX;
    if(Math.abs(diffX) < 50) return;
    const abas = ['painel','abastecer','veiculos'];
    const idx = abas.indexOf(abaAtual);
    if(diffX > 50 && idx > 0) show(abas[idx-1]);
    if(diffX < -50 && idx < abas.length-1) show(abas[idx+1]);
  };
}

function renderVeiculosSelect(){
  if(!db.veiculos.length) {$('selVeiculo').innerHTML='<option>Sem veículo</option>'; return;}
  $('selVeiculo').innerHTML=db.veiculos.map(v=>`<option value="${v.id}" ${v.id==db.ativo?'selected':''}>${v.nome}</option>`).join('');
  $('selVeiculo').onchange=e=>{db.ativo=+e.target.value; save(); renderAll();}
}

function addVeiculo(){
  if(!$('vNome').value.trim()) return alert('Preencha modelo');
  db.veiculos.push({id:Date.now(),nome:$('vNome').value,kmCompra:0,kmDia:35});
  db.ativo=db.veiculos.at(-1).id;
  $('vNome').value='';
  save(); renderVeiculosSelect(); renderAll();
}

function renderAll(){
  const v=db.veiculos.find(x=>x.id==db.ativo);
  if(!v){$('kmAtual').textContent='0 km'; $('gasto').textContent='R$ 0'; $('kml').textContent='--'; return;}
  const abs=db.abastecimentos.filter(a=>a.veiculo==db.ativo);
  $('gasto').textContent='R$ '+abs.reduce((s,a)=>s+a.valor,0).toFixed(2);
  renderAbast();
}

function addAbast(){
  if(!$('aData').value||!$('aKm').value||!$('aLitros').value) return alert('Preencha tudo');
  db.abastecimentos.push({id:Date.now(),veiculo:db.ativo,data:$('aData').value,km:+$('aKm').value,litros:+$('aLitros').value,valor:+$('aTotal').value,valorL:+$('aValorL').value});
  $('aKm').value=$('aLitros').value=$('aValorL').value=$('aTotal').value='';
  save(); renderAll();
}

function renderAbast(){
  const list=db.abastecimentos.filter(a=>a.veiculo==db.ativo).sort((a,b)=>new Date(b.data)-new Date(a.data));
  $('listaAbast').innerHTML=list.map(a=>`
    <div class="item">
      <div><b>${a.data}</b><br><small>${a.km}km • ${a.litros}L • R$${a.valor.toFixed(2)}</small></div>
      <button class="btn-ghost btn-sm" onclick="toggleEditAbast(${a.id})">✏️</button>
    </div>
    <div id="editA${a.id}" class="inline-edit"></div>
  `).join('')||'<div style="text-align:center;color:var(--muted);padding:20px">Nenhum abastecimento</div>';
}

function toggleEditAbast(id){
  const box = $('editA'+id);
  if(box.classList.contains('active')){box.classList.remove('active'); return;}
  document.querySelectorAll('.inline-edit').forEach(b=>b.classList.remove('active'));
  const a=db.abastecimentos.find(x=>x.id==id);
  box.innerHTML = `<input id="eKm${id}" type="number" value="${a.km}"><button class="btn" onclick="saveEditAbast(${id})">Salvar</button>`;
  box.classList.add('active');
}

function saveEditAbast(id){
  const a=db.abastecimentos.find(x=>x.id==id);
  a.km=+$(`eKm${id}`).value;
  save(); toggleEditAbast(id); renderAll();
}

function renderGrafico(){
  const canvas=$('graficoConsumo'); if(!canvas) return;
  const ctx=canvas.getContext('2d'); if(grafico) grafico.destroy();
  grafico=new Chart(ctx,{type:'bar',data:{labels:['Teste'],datasets:[{label:'km/l',data:[20],backgroundColor:'#3b82f6'}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false}});
}

load();
</script>
</body>
</html>
